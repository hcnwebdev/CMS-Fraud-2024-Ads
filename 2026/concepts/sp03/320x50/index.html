<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="ad.size" content="width=320,height=50">
  <title>CMS Medicare Fraud Awareness — 320x50 — Spanish</title>

  <!-- Self-hosted Outfit subset (banner characters only, woff2) -->
  <style>
    @font-face {
      font-family: 'Outfit';
      font-weight: 700;
      font-style: normal;
      font-display: block;
      src: url('assets/outfit-700-subset.woff2') format('woff2');
    }
    @font-face {
      font-family: 'Outfit';
      font-weight: 800;
      font-style: normal;
      font-display: block;
      src: url('assets/outfit-800-subset.woff2') format('woff2');
    }
  </style>

  <style>
    /* ── Reset ──────────────────────────────────────────────── */
    *, *::before, *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      width: 320px;
      height: 50px;
      overflow: hidden;
    }

    /* ── Banner shell ─────────────────────────────────────── */
    #banner {
      position: relative;
      width: 320px;
      height: 50px;
      overflow: hidden;
      background-color: #dff8fc;
      font-family: 'Outfit', sans-serif;
      cursor: pointer;
      user-select: none;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    /* ── All layers: absolute-positioned, start invisible ──── */
    .layer {
      position: absolute;
      opacity: 0;
      will-change: transform;
    }

    /* ── Disclaimer (frame 1 — centered, no bar) ──────────── */
    /* Vertically centered: top = (50 − 22) / 2 = 14 px       */
    #disclaimer {
      left: 0;
      top: 14px;
      width: 320px;
      height: 22px;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0 20px;
    }

    #disclaimer span {
      font-size: 11px;
      font-weight: 800;
      color: #323a45;
      letter-spacing: 2.2px;
      text-transform: uppercase;
      text-align: center;
      line-height: 1;
      white-space: nowrap;
    }

    /* ── Stripes SVG (365×184, no baked-in rotation) ─────────── */
    /* Rotation: −20° / 160° / −20°. Center x fixed at 256 px.   */
    #stripes-wrap {
      position: absolute;
      left: 170px;
      top: 0;
      width: 172px;
      height: 87px;
      z-index: 1;
    }

    /* ── Scene text blocks (left column, all scenes) ──────── */
    #s1-txt {
      left: 16px;
      top: 0;
      width: 210px;
      height: 50px;
      font-size: 18px;
      font-weight: 700;
      color: #323a45;
      line-height: 1;
      letter-spacing: -0.18px;
      display: flex;
      align-items: center;
      z-index: 3;
    }

    #s2-txt,
    #s3-txt {
      left: 16px;
      top: 0;
      width: 194px;
      height: 50px;
      font-size: 18px;
      font-weight: 700;
      color: #323a45;
      line-height: 1;
      letter-spacing: -0.18px;
      display: flex;
      align-items: center;
      z-index: 3;
    }

    /* ── Scene image blocks (right column) ───────────────── */
    #s1-img {
      right: 0;
      top: 0;
      width: 100px;
      height: 50px;
      overflow: hidden;
      z-index: 2;
    }
    #s1-img img { width: 100%; height: 100%; display: block; }

    #s2-img {
      left: 187px;
      top: 0;
      width: 133px;
      height: 50px;
      overflow: hidden;
      z-index: 2;
    }
    #s2-img img { width: 100%; height: 100%; display: block; }

    #s3-img {
      left: 218px;
      top: 0;
      width: 102px;
      height: 50px;
      overflow: hidden;
      z-index: 2;
    }
    #s3-img img { width: 100%; height: 100%; display: block; }

    /* ── Endcard — horizontal two-column layout ──────────── */
    /* Left: headline (phase 1) or logo (phase 2)             */
    /* Right: button (persists across both phases)            */
    #endcard {
      position: absolute;
      left: 0;
      top: 0;
      width: 320px;
      height: 50px;
      z-index: 5;
    }

    .ec-item {
      opacity: 0;
      will-change: transform;
    }

    #ec-headline {
      position: absolute;
      left: 16px;
      top: 0;
      width: 172px;
      height: 50px;
      font-size: 17px;
      font-weight: 700;
      color: #ffffff;
      line-height: 1;
      letter-spacing: -0.17px;
      display: flex;
      align-items: center;
    }

    #ec-logo {
      position: absolute;
      left: 16px;
      top: 50%;
      width: 140px;
      height: 12px;
      flex-shrink: 0;
    }
    #ec-logo img { width: 100%; height: 100%; display: block; }

    #ec-btn {
      position: absolute;
      left: 201px;
      top: 50%;
      background-color: #f5f15d;
      padding: 7px 12px;
      border-radius: 4px;
      box-shadow: 0 8px 14px -10px rgba(0, 0, 0, 0.55);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }

    #ec-btn-label {
      display: block;
      font-size: 13px;
      font-weight: 700;
      color: #323a45;
      line-height: 1;
      letter-spacing: -0.13px;
      white-space: nowrap;
    }

    /* ── Banner border overlay ────────────────────────────── */
    #border-ol {
      position: absolute;
      inset: 0;
      border: 1px solid rgba(0, 0, 0, 0.12);
      pointer-events: none;
      z-index: 50;
    }
  </style>
</head>
<body>

  <div id="banner">

    <!-- Disclaimer (frame 1 only — fades out before scene 1) -->
    <div class="layer" id="disclaimer">
      <span>un mensaje oficial de medicare</span>
    </div>

    <!-- Decorative stripes (SVG, animated as one unit) -->
    <img class="layer" id="stripes-wrap" src="assets/stripes.svg" alt="">

    <!-- Scene 1: Medicare statement / card visual -->
    <div class="layer" id="s1-img">
      <img src="assets/scene_1-img.webp" alt="">
    </div>
    <p class="layer" id="s1-txt">Revise su estado de cuenta de Medicare.</p>

    <!-- Scene 2: Billing statement match -->
    <div class="layer" id="s2-img">
      <img src="assets/scene_2-img.webp" alt="">
    </div>
    <p class="layer" id="s2-txt">Asegúrese de que la factura coincida...</p>

    <!-- Scene 3: Service received -->
    <div class="layer" id="s3-img">
      <img src="assets/scene_3-img.webp" alt="">
    </div>
    <p class="layer" id="s3-txt">... con el servicio que recibió.</p>

    <!-- Endcard: phase 1 (headline) → phase 2 (logo), button persists -->
    <div id="endcard">
      <p class="ec-item" id="ec-headline">Reporte cualquier actividad sospechosa.</p>
      <div class="ec-item" id="ec-logo">
        <img src="assets/medicare-logo.png" alt="Medicare">
      </div>
      <div class="ec-item" id="ec-btn">
        <span id="ec-btn-label">Aprenda más</span>
      </div>
    </div>

    <!-- Border -->
    <div id="border-ol"></div>

  </div><!-- /#banner -->

  <!-- ── GSAP 3 + CustomEase (combined local) ─────────── -->
  <script src="gsap-with-ease.min.js"></script>

  <script>
    /* ── Click tag ──────────────────────────────────────────── */
    var clickTag = "";

    document.getElementById("ec-btn").addEventListener("click", function (e) {
      e.stopPropagation();
      if (clickTag) window.open(clickTag, "_blank");
    });
    document.getElementById("banner").addEventListener("click", function () {
      if (clickTag) window.open(clickTag, "_blank");
    });

    /* ── Register custom eases ──────────────────────────────── */
    CustomEase.create("fadeSlide", "M0,0 C0.22,1 0.36,1 1,1");
    CustomEase.create("snapOut",   "M0,0 C0,0 0.123,1.196 0.33,1.319 0.449,1.389 0.582,1.158 0.68,1.09 0.844,0.974 1,1 1,1");

    /* ── Initial states ─────────────────────────────────────── */
    /* Stripes: no baked rotation. Scene 1 y = 16 (center at ~59 px). *
     * Entrance starts 20 px below: 16 + 20 = 36.                     */
    gsap.set("#stripes-wrap", { y: 36, rotation: -20 });
    gsap.set("#s1-txt",       { y: 6 });
    gsap.set("#s2-txt",       { y: 6 });
    gsap.set("#s3-txt",       { y: 6 });
    /* Endcard: button and logo centered via yPercent */
    gsap.set("#ec-btn",       { yPercent: -50, scale: 0.85 });
    gsap.set("#ec-logo",      { yPercent: -50 });
    gsap.set("#ec-headline",  { x: -8 });

    /* ── Timeline  |  15.5 s × repeat: 1 = 31 s total ────────── */
    var tl = gsap.timeline({ repeat: 1, repeatDelay: 0 });

    /* ── FRAME 1: Disclaimer only  (0 s – 2 s) ──────────────── */
    tl
      .to("#disclaimer",   { opacity: 1,                                  duration: 0.5, ease: "fadeSlide"    }, 0)
      .to("#disclaimer",   { opacity: 0,                                  duration: 0.4, ease: "power2.inOut" }, 1.6)

    /* ── SCENE 1  (2 s – 5 s) ────────────────────────────────── */
      .to("#stripes-wrap", { opacity: 1, y: 16,                           duration: 0.5, ease: "fadeSlide"    }, 2.0)
      .to("#s1-img",       { opacity: 1,                                  duration: 0.4, ease: "fadeSlide"    }, 2.3)
      .to("#s1-txt",       { opacity: 1, y: 0,                            duration: 0.7, ease: "fadeSlide"    }, 2.5)

    /* ── SCENE 1 → 2  (slide down off bottom, teleport, slide down from top) */
      .to(["#s1-img", "#s1-txt"], { opacity: 0,                           duration: 0.4, ease: "power2.inOut" }, 4.5)
      .to("#stripes-wrap",        { y: 120,                               duration: 0.4, ease: "power2.in"    }, 4.5)
      .set("#stripes-wrap",       { y: -150, rotation: -160 },                                                   4.95)
      .to("#stripes-wrap",        { y: -60,                               duration: 0.5, ease: "fadeSlide"    }, 4.95)

    /* ── SCENE 2  (5 s – 8 s) ────────────────────────────────── */
      .to("#s2-img",       { opacity: 1,                                  duration: 0.4, ease: "fadeSlide"    }, 5.0)
      .to("#s2-txt",       { opacity: 1, y: 0,                            duration: 0.7, ease: "fadeSlide"    }, 5.3)

    /* ── SCENE 2 → 3  (slide up off top, teleport, slide up from bottom) */
      .to(["#s2-img", "#s2-txt"], { opacity: 0,                           duration: 0.4, ease: "power2.inOut" }, 7.5)
      .to("#stripes-wrap",        { y: -150,                              duration: 0.4, ease: "power2.in"    }, 7.5)
      .set("#stripes-wrap",       { y: 120, rotation: -20 },                                                     7.95)
      .to("#stripes-wrap",        { y: 16,                                duration: 0.5, ease: "fadeSlide"    }, 7.95)

    /* ── SCENE 3  (8 s – 11 s) ───────────────────────────────── */
      .to("#s3-img",       { opacity: 1,                                  duration: 0.4, ease: "fadeSlide"    }, 8.0)
      .to("#s3-txt",       { opacity: 1, y: 0,                            duration: 0.7, ease: "fadeSlide"    }, 8.2)

    /* ── SCENE 3 → ENDCARD ──────────────────────────────────── */
      .to(["#s3-img", "#s3-txt", "#stripes-wrap"], { opacity: 0,          duration: 0.5, ease: "power2.inOut" }, 10.5)
      .to("#banner",       { backgroundColor: "#146a5d",                  duration: 0.7, ease: "power2.inOut" }, 10.7)

    /* ── ENDCARD phase 1: headline + button  (11 s) ─────────── */
      .to("#ec-headline",  { opacity: 1, x: 0,                            duration: 0.7, ease: "fadeSlide"    }, 11.0)
      .to("#ec-btn",       { opacity: 1, scale: 1,                        duration: 0.4, ease: "snapOut"      }, 11.25)

    /* ── ENDCARD phase 2: swap headline → logo  (12.5 s) ──────── */
      .to("#ec-headline",  { opacity: 0,                                  duration: 0.4, ease: "power2.inOut" }, 12.5)
      .to("#ec-logo",      { opacity: 1,                                  duration: 0.5, ease: "fadeSlide"    }, 12.7)

    /* ── Hold at 15.5 s, then loop ───────────────────────────── */
      .to({}, { duration: 0.001 }, 15.5);

    /* ── CTA button hover ───────────────────────────────────── */
    var ecBtn = document.getElementById("ec-btn");
    ecBtn.addEventListener("mouseenter", function () {
      gsap.to(ecBtn, { scale: 1.05, duration: 0.18, ease: "power2.out", overwrite: "auto" });
    });
    ecBtn.addEventListener("mouseleave", function () {
      gsap.to(ecBtn, { scale: 1,    duration: 0.18, ease: "power2.out", overwrite: "auto" });
    });

  </script>
</body>
</html>
