<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="ad.size" content="width=970,height=250">
  <title>CMS Medicare Fraud Awareness — 970x250 — Spanish</title>

  <style>
    @font-face {
      font-family: 'Outfit';
      font-weight: 500;
      font-style: normal;
      font-display: block;
      src: url('assets/outfit-500-subset.woff2') format('woff2');
    }
    @font-face {
      font-family: 'Outfit';
      font-weight: 700;
      font-style: normal;
      font-display: block;
      src: url('assets/outfit-700-subset.woff2') format('woff2');
    }
    @font-face {
      font-family: 'Outfit';
      font-weight: 800;
      font-style: normal;
      font-display: block;
      src: url('assets/outfit-800-subset.woff2') format('woff2');
    }
  </style>

  <style>
    *, *::before, *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      width: 970px;
      height: 250px;
      overflow: hidden;
    }

    #banner {
      position: relative;
      width: 970px;
      height: 250px;
      overflow: hidden;
      background-color: #fffbe5;
      font-family: 'Outfit', sans-serif;
      cursor: pointer;
      user-select: none;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    .layer {
      position: absolute;
      opacity: 0;
      will-change: transform;
    }

    #endcard-bg {
      position: absolute;
      inset: 0;
      background-color: #e8f1ff;
      z-index: 6;
      opacity: 0;
    }

    /* ── Scene 1 ──────────────────────────────────────────── */
    #scene-1-img {
      left: 618px;
      top: 24px;
      width: 352px;
      height: 200px;
      overflow: hidden;
      z-index: 0;
    }
    #scene-1-img img {
      width: 100%;
      height: 100%;
      display: block;
      object-fit: cover;
    }

    #s1-txt {
      left: 60px;
      top: 67px;
      width: 540px;
      font-size: 40px;
      font-weight: 500;
      color: #1e3c70;
      line-height: 1.05;
      letter-spacing: -0.4px;
      z-index: 3;
    }
    #s1-txt strong {
      font-weight: 700;
    }

    #word-stroke {
      left: 348px;
      top: 153px;
      z-index: 4;
      overflow: visible;
    }

    /* ── Scene 2 ──────────────────────────────────────────── */
    #scene-2-img {
      left: 668px;
      top: 12px;
      width: 260px;
      height: 238px;
      overflow: hidden;
      z-index: 2;
    }
    #scene-2-img img {
      width: 100%;
      height: 100%;
      display: block;
      object-fit: cover;
    }

    /* one line, 46px/700 */
    #s23-txt {
      left: 60px;
      top: 62px;
      width: 523px;
      font-size: 46px;
      font-weight: 700;
      color: #1e3c70;
      line-height: 1.05;
      letter-spacing: -0.46px;
      z-index: 3;
    }

    #arrow-wrap-2 {
      left: 448px;
      top: 80px;
      width: 209px;
      height: 164px;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 4;
    }
    #arrow-inner-2 {
      transform: rotate(-150deg);
      flex: none;
      line-height: 0;
    }

    /* ── Scene 3 ──────────────────────────────────────────── */
    /* clip container: 300×203 at left:612; image 363×301 bleeds 34px right */
    #scene-3-img {
      left: 612px;
      top: 47px;
      width: 300px;
      height: 203px;
      overflow: hidden;
      z-index: 3;
    }
    #scene-3-img img {
      position: absolute;
      right: 0px;
      top: 0;
      width: 300px;
      height: 203px;
      display: block;
    }

    #arrow-wrap-3 {
      left: 564px;
      top: 56px;
      width: 211px;
      height: 141px;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 4;
    }
    #arrow-inner-3 {
      transform: rotate(-21deg);
      flex: none;
      line-height: 0;
    }

    /* ── Disclaimer bar ───────────────────────────────────── */
    #disclaimer {
      left: 0;
      bottom: 0;
      width: 970px;
      height: 26px;
      background-color: #e8f1ff;
      display: flex;
      align-items: center;
      justify-content: start;
      padding: 0 60px;
      z-index: 1;
    }
    #disclaimer span {
      font-size: 13px;
      font-weight: 800;
      color: #1e3c70;
      letter-spacing: 4.29px;
      text-transform: uppercase;
      line-height: 1;
      white-space: nowrap;
    }

    /* ── Endcard ──────────────────────────────────────────── */
    /* full-width row: headline left | btn+logo column right */
    #endcard {
      position: absolute;
      left: 0;
      width: 970px;
      top: 50%;
      transform: translateY(-50%);
      padding: 0 60px;
      display: flex;
      flex-direction: row;
      align-items: center;
      justify-content: space-between;
      z-index: 7;
    }

    .ec-item {
      opacity: 0;
      will-change: transform;
    }

    #ec-headline {
      width: 462px;
      font-size: 50px;
      font-weight: 700;
      color: #1e3c70;
      text-align: left;
      line-height: 1.16;
      letter-spacing: -0.5px;
    }

    #ec-right {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 30px;
    }

    #ec-btn {
      width: 229px;
      height: 57px;
      background-color: #146a5d;
      border-radius: 4px;
      padding: 18px 24px;
      box-shadow: 0 8px 14px -10px rgba(0, 0, 0, 0.55);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }

    #ec-btn-label {
      display: block;
      font-size: 30px;
      font-weight: 700;
      color: #ffffff;
      line-height: 1.05;
      letter-spacing: -0.3px;
      white-space: nowrap;
    }

    #ec-logo {
      width: 300px;
      height: 26px;
    }
    #ec-logo img {
      width: 100%;
      height: 100%;
      display: block;
    }

    #border-ol {
      position: absolute;
      inset: 0;
      border: 1px solid rgba(0, 0, 0, 0.12);
      pointer-events: none;
      z-index: 50;
    }
  </style>
</head>
<body>

  <div id="banner">

    <div id="endcard-bg"></div>

    <!-- ── SCENE 1 ────────────────────────────────────────── -->
    <div class="layer" id="scene-1-img">
      <img src="assets/scene_1-img.webp" alt="">
    </div>

    <p class="layer" id="s1-txt">¿Regalos <strong>&ldquo;gratuitos&rdquo;</strong> a cambio de su número de <strong>Medicare</strong>?</p>

    <svg class="layer" id="word-stroke"
         width="171" height="22"
         viewBox="0 0 102.953 16.718"
         preserveAspectRatio="none"
         style="overflow:visible;">
      <defs>
        <mask id="wm" maskUnits="userSpaceOnUse" x="-5" y="-20" width="115" height="55">
          <path id="wmp"
                d="M1.04372 12.8566C1.04372 12.8566 49.0437 -0.143382 102.544 5.35661"
                stroke="white" stroke-width="34" fill="none" stroke-linecap="round"/>
        </mask>
      </defs>
      <image href="assets/word-stroke.png"
             x="-0.25" y="-2.52" width="103" height="15"
             preserveAspectRatio="none" mask="url(#wm)"/>
    </svg>

    <!-- ── SCENE 2 ────────────────────────────────────────── -->
    <div class="layer" id="scene-2-img">
      <img src="assets/scene_2-img.webp" alt="">
    </div>

    <p class="layer" id="s23-txt">No se confíe. Es fraude.</p>

    <div class="layer" id="arrow-wrap-2">
      <div id="arrow-inner-2">
        <svg width="197" height="75"
             viewBox="0 0 197 75"
             preserveAspectRatio="none"
             style="display:block; overflow:visible;">
          <defs>
            <mask id="am2" maskUnits="userSpaceOnUse" x="-20" y="-20" width="240" height="130">
              <path id="amp2"
                    d="M11.16 71.63C11.16 71.63 18.10 31.10 52.92 19.80C87.73 8.51 118.39 31.57 107.11 56.01C95.84 80.44 50.68 52.10 91.68 19.80C115.67 0.89 169.15 11.02 188.32 31.06"
                    stroke="white" stroke-width="48" fill="none"
                    stroke-linecap="round" stroke-linejoin="round"/>
            </mask>
          </defs>
          <image href="assets/arrow-stroke.png"
                 x="0" y="0" width="197" height="75"
                 preserveAspectRatio="none"
                 mask="url(#am2)"/>
        </svg>
      </div>
    </div>

    <!-- ── SCENE 3 ────────────────────────────────────────── -->
    <div class="layer" id="scene-3-img">
      <img src="assets/scene_3-img.webp" alt="">
    </div>

    <div class="layer" id="arrow-wrap-3">
      <div id="arrow-inner-3">
        <svg width="197" height="75"
             viewBox="0 0 197 75"
             preserveAspectRatio="none"
             style="display:block; overflow:visible;">
          <defs>
            <mask id="am3" maskUnits="userSpaceOnUse" x="-20" y="-20" width="240" height="130">
              <path id="amp3"
                    d="M11.16 71.63C11.16 71.63 18.10 31.10 52.92 19.80C87.73 8.51 118.39 31.57 107.11 56.01C95.84 80.44 50.68 52.10 91.68 19.80C115.67 0.89 169.15 11.02 188.32 31.06"
                    stroke="white" stroke-width="48" fill="none"
                    stroke-linecap="round" stroke-linejoin="round"/>
            </mask>
          </defs>
          <image href="assets/arrow-stroke.png"
                 x="0" y="0" width="197" height="75"
                 preserveAspectRatio="none"
                 mask="url(#am3)"/>
        </svg>
      </div>
    </div>

    <div class="layer" id="disclaimer">
      <span>Un mensaje oficial de Medicare</span>
    </div>

    <!-- ── ENDCARD ─────────────────────────────────────────── -->
    <div id="endcard">
      <p class="ec-item" id="ec-headline">Protéjase contra el fraude a Medicare</p>
      <div id="ec-right">
        <div class="ec-item" id="ec-btn">
          <span id="ec-btn-label">Aprenda más</span>
        </div>
        <div class="ec-item" id="ec-logo">
          <img src="assets/medicare-logo.png" alt="Medicare">
        </div>
      </div>
    </div>

    <div id="border-ol"></div>

  </div><!-- /#banner -->

  <script src="gsap-with-ease.min.js"></script>

  <script>
    var clickTag = "";

    document.getElementById("ec-btn").addEventListener("click", function (e) {
      e.stopPropagation();
      if (clickTag) window.open(clickTag, "_blank");
    });
    document.getElementById("banner").addEventListener("click", function () {
      if (clickTag) window.open(clickTag, "_blank");
    });

    CustomEase.create("fadeSlide", "M0,0 C0.22,1 0.36,1 1,1");
    CustomEase.create("snapOut",   "M0,0 C0,0 0.123,1.196 0.33,1.319 0.449,1.389 0.582,1.158 0.68,1.09 0.844,0.974 1,1 1,1");

    var wmp  = document.getElementById("wmp");
    var amp2 = document.getElementById("amp2");
    var amp3 = document.getElementById("amp3");
    var wlen = wmp.getTotalLength();
    var alen = amp2.getTotalLength();

    wmp.style.strokeDasharray  = wlen;
    amp2.style.strokeDasharray = alen;
    amp3.style.strokeDasharray = alen;

    gsap.set("#ec-headline", { x: -10 });
    gsap.set("#ec-btn",      { scale: 0.85 });

    var tl = gsap.timeline({ repeat: 1, repeatDelay: 0 });

    tl
      .fromTo("#disclaimer",   { opacity: 0 }, { opacity: 1,                  duration: 0.4, ease: "fadeSlide"    }, 0)
      .fromTo("#scene-1-img",  { opacity: 0, y: 20 }, { opacity: 1, y: 0,     duration: 0.5, ease: "fadeSlide"    }, 0)
      .fromTo("#s1-txt",       { opacity: 0, y: 8  }, { opacity: 1, y: 0,     duration: 0.7, ease: "fadeSlide"    }, 0.25)
      .fromTo("#word-stroke",  { opacity: 0 }, { opacity: 1,                  duration: 0.1                       }, 0.75)
      .fromTo(wmp, { strokeDashoffset: wlen }, { strokeDashoffset: 0,         duration: 0.6, ease: "power2.inOut" }, 0.75)

      .to(["#s1-txt", "#scene-1-img", "#word-stroke"], { opacity: 0,          duration: 0.3, ease: "power2.inOut" }, 3.5)

      .fromTo("#scene-2-img",  { opacity: 0 }, { opacity: 1,                  duration: 0.5, ease: "fadeSlide"    }, 3.8)
      .fromTo("#s23-txt",      { opacity: 0, x: -8 }, { opacity: 1, x: 0,    duration: 0.7, ease: "fadeSlide"    }, 4.0)
      .fromTo("#arrow-wrap-2", { opacity: 0 }, { opacity: 1,                  duration: 0.1                       }, 4)
      .fromTo(amp2, { strokeDashoffset: alen }, { strokeDashoffset: 0,        duration: 0.9, ease: "power2.inOut" }, 4)

      .to(["#scene-2-img", "#arrow-wrap-2"], { opacity: 0,                    duration: 0.3, ease: "power2.inOut" }, 7.5)

      .fromTo("#scene-3-img",
        { opacity: 0, y: 100, rotation: 20, transformOrigin: "bottom right" },
        { opacity: 1, y: 0,  rotation:  0,                duration: 0.65, ease: "fadeSlide" }, 7.8)
      .fromTo("#arrow-wrap-3", { opacity: 0 }, { opacity: 1,                  duration: 0.1                       }, 8)
      .fromTo(amp3, { strokeDashoffset: alen }, { strokeDashoffset: 0,        duration: 0.9, ease: "power2.inOut" }, 8)

      .to(["#scene-3-img", "#s23-txt", "#arrow-wrap-3", "#disclaimer"], { opacity: 0, duration: 0.5, ease: "power2.inOut" }, 11.0)
      .to("#endcard-bg",   { opacity: 1,                                        duration: 0.7, ease: "power2.inOut" }, 11.2)
      .to("#ec-headline",  { opacity: 1, x: 0,                                  duration: 0.7, ease: "fadeSlide"    }, 11.5)
      .to("#ec-btn",       { opacity: 1, scale: 1,                              duration: 0.4, ease: "snapOut"      }, 11.85)
      .to("#ec-logo",      { opacity: 1,                                        duration: 0.5, ease: "fadeSlide"    }, 12.1)
      .to({}, { duration: 0.001 }, 15);

    var ecBtn = document.getElementById("ec-btn");
    ecBtn.addEventListener("mouseenter", function () {
      gsap.to(ecBtn, { scale: 1.05, duration: 0.18, ease: "power2.out", overwrite: "auto" });
    });
    ecBtn.addEventListener("mouseleave", function () {
      gsap.to(ecBtn, { scale: 1,    duration: 0.18, ease: "power2.out", overwrite: "auto" });
    });

  </script>
</body>
</html>
