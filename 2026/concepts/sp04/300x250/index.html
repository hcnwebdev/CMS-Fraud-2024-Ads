<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="ad.size" content="width=300,height=250">
  <title>CMS Medicare Fraud Awareness — 300x250 — Spanish</title>

  <!-- Self-hosted Outfit subset (banner characters only, woff2) -->
  <style>
    @font-face {
      font-family: 'Outfit';
      font-weight: 500;
      font-style: normal;
      font-display: block;
      src: url('assets/outfit-500-subset.woff2') format('woff2');
    }
    @font-face {
      font-family: 'Outfit';
      font-weight: 700;
      font-style: normal;
      font-display: block;
      src: url('assets/outfit-700-subset.woff2') format('woff2');
    }
    @font-face {
      font-family: 'Outfit';
      font-weight: 800;
      font-style: normal;
      font-display: block;
      src: url('assets/outfit-800-subset.woff2') format('woff2');
    }
  </style>

  <style>
    /* ── Reset ──────────────────────────────────────────────── */
    *, *::before, *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      width: 300px;
      height: 250px;
      overflow: hidden;
    }

    /* ── Banner shell ─────────────────────────────────────── */
    #banner {
      position: relative;
      width: 300px;
      height: 250px;
      overflow: hidden;
      background-color: #fffbe5;
      font-family: 'Outfit', sans-serif;
      cursor: pointer;
      user-select: none;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    /* ── All layers: absolute-positioned, start invisible ──── */
    .layer {
      position: absolute;
      opacity: 0;
      will-change: transform;
    }

    /* ── Endcard background overlay ──────────────────────── */
    #endcard-bg {
      position: absolute;
      inset: 0;
      background-color: #e8f1ff;
      z-index: 6;
      opacity: 0;
    }

    /* ── Scene 1: gift illustration ───────────────────────── */
    #scene-1-img {
      left: 29px;
      top: 120px;
      width: 243px;
      height: 130px;
      overflow: hidden;
      z-index: 2;
    }
    #scene-1-img img {
      width: 100%;
      height: 100%;
      display: block;
      object-fit: cover;
    }

    /* Scene 1 text — medium weight, bold spans for gratuitos / Medicare */
    #s1-txt {
      left: 20px;
      top: 17px;
      width: 260px;
      font-size: 24px;
      font-weight: 500;
      color: #1e3c70;
      line-height: 1;
      letter-spacing: -0.24px;
      text-align: center;
      z-index: 3;
    }
    #s1-txt strong {
      font-weight: 700;
    }

    /* word-stroke: inline SVG, mask-driven draw */
    #word-stroke {
      left: 112px;
      top: 90px;
      z-index: 4;
      overflow: visible;
    }

    /* ── Scene 2: man with glasses ────────────────────────── */
    #scene-2-img {
      left: 70px;
      top: 35px;
      width: 230px;
      height: 215px;
      overflow: hidden;
      z-index: 2;
    }
    #scene-2-img img {
      width: 100%;
      height: 100%;
      display: block;
      object-fit: cover;
    }

    /* Scene 2 + 3 shared headline */
    #s23-txt {
      left: 20px;
      top: 17px;
      width: 184px;
      font-size: 28px;
      font-weight: 700;
      color: #1e3c70;
      line-height: 1.0;
      letter-spacing: -0.28px;
      z-index: 3;
    }

    /* arrow-stroke 2: container starts outside left edge,
       inner element is flipped + rotated per Figma           */
    #arrow-wrap-2 {
      left: -18px;
      top: 56px;
      width: 126.684px;
      height: 168.74px;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 4;
    }
    #arrow-inner-2 {
      transform: scaleY(-1) rotate(63.5deg);
      flex: none;
      line-height: 0;
    }

    /* ── Scene 3: hand raising phone ─────────────────────── */
    #scene-3-img {
      right: 20px;
      top: 65px;
      width: 217px;
      height: 185px;
      overflow: hidden;
      z-index: 2;
    }
    #scene-3-img img {
      width: 100%;
      height: 100%;
      display: block;
      object-fit: cover;
    }

    /* arrow-stroke 3: inside frame, slight rotation */
    #arrow-wrap-3 {
      left: 20px;
      top: 90px;
      width: 166.464px;
      height: 93.309px;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 4;
    }
    #arrow-inner-3 {
      transform: rotate(-11.5deg);
      flex: none;
      line-height: 0;
    }

    /* ── Disclaimer bar ───────────────────────────────────── */
    #disclaimer {
      left: 0;
      bottom: 0;
      width: 300px;
      height: 22px;
      background-color: #e8f1ff;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0 20px;
      z-index: 5;
    }
    #disclaimer span {
      font-size: 11px;
      font-weight: 800;
      color: #1e3c70;
      letter-spacing: 2.2px;
      text-transform: uppercase;
      line-height: 1;
      white-space: nowrap;
    }

    /* ── Endcard content block ────────────────────────────── */
    #endcard {
      position: absolute;
      left: 20px;
      top: 39px;
      width: 260px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 24px;
      z-index: 7;
    }

    .ec-item {
      opacity: 0;
      will-change: transform;
    }

    #ec-headline {
      font-size: 28px;
      font-weight: 700;
      color: #1e3c70;
      text-align: center;
      line-height: 1.05;
      letter-spacing: -0.28px;
      width: 260px;
    }

    #ec-btn {
      background-color: #146a5d;
      border-radius: 4px;
      padding: 12px 20px;
      box-shadow: 0 8px 14px -10px rgba(0, 0, 0, 0.55);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }

    #ec-btn-label {
      display: block;
      font-size: 24px;
      font-weight: 700;
      color: #ffffff;
      line-height: 1.05;
      letter-spacing: -0.24px;
      white-space: nowrap;
    }

    #ec-logo {
      width: 231px;
      height: 20px;
    }
    #ec-logo img {
      width: 100%;
      height: 100%;
      display: block;
    }

    /* ── Banner border overlay ────────────────────────────── */
    #border-ol {
      position: absolute;
      inset: 0;
      border: 1px solid rgba(0, 0, 0, 0.12);
      pointer-events: none;
      z-index: 50;
    }
  </style>
</head>
<body>

  <div id="banner">

    <!-- Endcard background overlay -->
    <div id="endcard-bg"></div>

    <!-- ── SCENE 1 ────────────────────────────────────────── -->
    <div class="layer" id="scene-1-img">
      <img src="assets/scene_1-img.jpg" alt="">
    </div>

    <p class="layer" id="s1-txt">¿Regalos <strong>&ldquo;gratuitos&rdquo;</strong> a cambio de su número <br>de <strong>Medicare</strong>?</p>

    <!-- word-stroke: PNG texture revealed through animated SVG mask -->
    <svg class="layer" id="word-stroke"
         width="101.5" height="15"
         viewBox="0 0 102.953 16.718"
         preserveAspectRatio="none"
         style="overflow:visible;">
      <defs>
        <mask id="wm" maskUnits="userSpaceOnUse" x="-5" y="-20" width="115" height="55">
          <path id="wmp"
                d="M1.04372 12.8566C1.04372 12.8566 49.0437 -0.143382 102.544 5.35661"
                stroke="white" stroke-width="34" fill="none" stroke-linecap="round"/>
        </mask>
      </defs>
      <image href="assets/word-stroke.png"
             x="-0.25" y="-2.52" width="103" height="15"
             preserveAspectRatio="none"
             mask="url(#wm)"/>
    </svg>

    <!-- ── SCENE 2 ────────────────────────────────────────── -->
    <div class="layer" id="scene-2-img">
      <img src="assets/scene_2-img.jpg" alt="">
    </div>

    <!-- Headline shared by scenes 2 and 3 -->
    <p class="layer" id="s23-txt">No se confíe.<br>Es fraude.</p>

    <!-- Arrow stroke 2: enters from outside-left, scaleY(-1) rotate(-63.5deg) -->
    <div class="layer" id="arrow-wrap-2">
      <div id="arrow-inner-2">
        <svg width="177" height="82"
             viewBox="0 0 174.589 76.7257"
             preserveAspectRatio="none"
             style="display:block; overflow:visible;">
          <defs>
            <mask id="am2" maskUnits="userSpaceOnUse" x="-20" y="-20" width="220" height="130">
              <path id="amp2"
                    d="M9.89095 73.2732C9.89095 73.2732 16.0345 31.8114 46.8817 20.2599C77.7289 8.70842 104.882 32.2964 94.8817 57.2964C84.8817 82.2964 44.8817 53.2963 81.2217 20.2599C102.504 0.912646 149.891 11.2732 166.891 31.7732"
                    stroke="white" stroke-width="28" fill="none"
                    stroke-linecap="round" stroke-linejoin="round"/>
            </mask>
          </defs>
          <image href="assets/arrow-stroke.png"
                 x="0" y="0" width="156" height="62"
                 preserveAspectRatio="none"
                 mask="url(#am2)"/>
        </svg>
      </div>
    </div>

    <!-- ── SCENE 3 ────────────────────────────────────────── -->
    <!-- Phone raises from below with slight rotation -->
    <div class="layer" id="scene-3-img">
      <img src="assets/scene_3-img.jpg" alt="">
    </div>

    <!-- Arrow stroke 3: inside frame, rotate(-11.5deg), draws after phone rises -->
    <div class="layer" id="arrow-wrap-3">
      <div id="arrow-inner-3">
        <svg width="177" height="82"
             viewBox="0 0 174.589 76.7257"
             preserveAspectRatio="none"
             style="display:block; overflow:visible;">
          <defs>
            <mask id="am3" maskUnits="userSpaceOnUse" x="-20" y="-20" width="220" height="130">
              <path id="amp3"
                    d="M9.89095 73.2732C9.89095 73.2732 16.0345 31.8114 46.8817 20.2599C77.7289 8.70842 104.882 32.2964 94.8817 57.2964C84.8817 82.2964 44.8817 53.2963 81.2217 20.2599C102.504 0.912646 149.891 11.2732 166.891 31.7732"
                    stroke="white" stroke-width="28" fill="none"
                    stroke-linecap="round" stroke-linejoin="round"/>
            </mask>
          </defs>
          <image href="assets/arrow-stroke.png"
                 x="-1" y="-2" width="156" height="62"
                 preserveAspectRatio="none"
                 mask="url(#am3)"/>
        </svg>
      </div>
    </div>

    <!-- Disclaimer bar (blends into endcard bg on transition) -->
    <div class="layer" id="disclaimer">
      <span>Un mensaje oficial de Medicare</span>
    </div>

    <!-- ── ENDCARD ─────────────────────────────────────────── -->
    <div id="endcard">
      <p class="ec-item" id="ec-headline">Protéjase contra el fraude a Medicare</p>
      <div class="ec-item" id="ec-btn">
        <span id="ec-btn-label">Aprenda más</span>
      </div>
      <div class="ec-item" id="ec-logo">
        <img src="assets/medicare-logo.png" alt="Medicare">
      </div>
    </div>

    <!-- Border -->
    <div id="border-ol"></div>

  </div><!-- /#banner -->

  <!-- ── GSAP 3 + CustomEase (combined local) ─────────── -->
  <script src="gsap-with-ease.min.js"></script>

  <script>
    /* ── Click tag ──────────────────────────────────────────── */
    var clickTag = "";

    document.getElementById("ec-btn").addEventListener("click", function (e) {
      e.stopPropagation();
      if (clickTag) window.open(clickTag, "_blank");
    });
    document.getElementById("banner").addEventListener("click", function () {
      if (clickTag) window.open(clickTag, "_blank");
    });

    /* ── Register custom eases ──────────────────────────────── */
    CustomEase.create("fadeSlide", "M0,0 C0.22,1 0.36,1 1,1");
    CustomEase.create("snapOut",   "M0,0 C0,0 0.123,1.196 0.33,1.319 0.449,1.389 0.582,1.158 0.68,1.09 0.844,0.974 1,1 1,1");

    /* ── Stroke mask paths ──────────────────────────────────── */
    var wmp  = document.getElementById("wmp");
    var amp2 = document.getElementById("amp2");
    var amp3 = document.getElementById("amp3");
    var wlen = wmp.getTotalLength();
    var alen = amp2.getTotalLength();  /* same path as amp3 */

    /* Set dasharray now so dashoffset animation works via fromTo */
    wmp.style.strokeDasharray  = wlen;
    amp2.style.strokeDasharray = alen;
    amp3.style.strokeDasharray = alen;

    /* ── Initial states ─────────────────────────────────────── */
    gsap.set("#ec-headline", { x: -10 });
    gsap.set("#ec-btn",      { scale: 0.85 });

    /* ── Timeline  |  15 s × repeat:1 = 30 s total ────────── */
    var tl = gsap.timeline({ repeat: 1, repeatDelay: 0 });

    /* ── SCENE 1  (0 – 3.5 s) ───────────────────────────────── */
    tl
      .fromTo("#disclaimer",   { opacity: 0 }, { opacity: 1,                  duration: 0.4, ease: "fadeSlide"    }, 0)
      .fromTo("#scene-1-img",  { opacity: 0, y: 20 }, { opacity: 1, y: 0,     duration: 0.5, ease: "fadeSlide"    }, 0)
      .fromTo("#s1-txt",       { opacity: 0, y: 8  }, { opacity: 1, y: 0,     duration: 0.7, ease: "fadeSlide"    }, 0.25)
      .fromTo("#word-stroke",  { opacity: 0 }, { opacity: 1,                  duration: 0.1                       }, 0.75)
      .fromTo(wmp, { strokeDashoffset: wlen }, { strokeDashoffset: 0,         duration: 0.6, ease: "power2.inOut" }, 0.75)

    /* ── SCENE 1 → 2 ─────────────────────────────────────────── */
      .to(["#s1-txt", "#scene-1-img", "#word-stroke"], { opacity: 0,          duration: 0.3, ease: "power2.inOut" }, 3.5)

    /* ── SCENE 2  (3.8 – 7.5 s) ─────────────────────────────── */
      .fromTo("#scene-2-img",  { opacity: 0 }, { opacity: 1,                  duration: 0.5, ease: "fadeSlide"    }, 3.8)
      .fromTo("#s23-txt",      { opacity: 0, x: -8 }, { opacity: 1, x: 0,    duration: 0.7, ease: "fadeSlide"    }, 4.0)
      .fromTo("#arrow-wrap-2", { opacity: 0 }, { opacity: 1,                  duration: 0.1                       }, 4)
      .fromTo(amp2, { strokeDashoffset: alen }, { strokeDashoffset: 0,        duration: 0.9, ease: "power2.inOut" }, 4)

    /* ── SCENE 2 → 3 ─────────────────────────────────────────── */
      .to(["#scene-2-img", "#arrow-wrap-2"], { opacity: 0,                    duration: 0.3, ease: "power2.inOut" }, 7.5)

    /* ── SCENE 3  (7.8 – 11.0 s) ────────────────────────────── */
      /* Phone rises from below with tilt, like a hand raising it  */
      .fromTo("#scene-3-img",
        { opacity: 0, y: 45, rotation: 14, transformOrigin: "bottom right" },
        { opacity: 1, y: 0,  rotation:  0,                duration: 0.65, ease: "fadeSlide" }, 7.8)
      .fromTo("#arrow-wrap-3", { opacity: 0 }, { opacity: 1,                  duration: 0.1                       }, 8)
      .fromTo(amp3, { strokeDashoffset: alen }, { strokeDashoffset: 0,        duration: 0.9, ease: "power2.inOut" }, 8)

    /* ── SCENE 3 → ENDCARD ───────────────────────────────────── */
      .to(["#scene-3-img", "#s23-txt", "#arrow-wrap-3", "#disclaimer"], { opacity: 0, duration: 0.5, ease: "power2.inOut" }, 11.0)
      .to("#endcard-bg",   { opacity: 1,                                        duration: 0.7, ease: "power2.inOut" }, 11.2)

    /* ── ENDCARD  (11.5 – 15 s) ──────────────────────────────── */
      .to("#ec-headline",  { opacity: 1, x: 0,                                  duration: 0.7, ease: "fadeSlide"    }, 11.5)
      .to("#ec-btn",       { opacity: 1, scale: 1,                              duration: 0.4, ease: "snapOut"      }, 11.85)
      .to("#ec-logo",      { opacity: 1,                                        duration: 0.5, ease: "fadeSlide"    }, 12.1)

    /* ── Hold at 15 s, then second play (endcard holds) ──────── */
      .to({}, { duration: 0.001 }, 15);

    /* ── CTA button hover ───────────────────────────────────── */
    var ecBtn = document.getElementById("ec-btn");
    ecBtn.addEventListener("mouseenter", function () {
      gsap.to(ecBtn, { scale: 1.05, duration: 0.18, ease: "power2.out", overwrite: "auto" });
    });
    ecBtn.addEventListener("mouseleave", function () {
      gsap.to(ecBtn, { scale: 1,    duration: 0.18, ease: "power2.out", overwrite: "auto" });
    });

  </script>
</body>
</html>
