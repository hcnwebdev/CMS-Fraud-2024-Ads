<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="ad.size" content="width=300,height=600">
  <title>CMS Medicare Fraud Awareness — 300x600 — Spanish</title>

  <style>
    @font-face {
      font-family: 'Outfit';
      font-weight: 500;
      font-style: normal;
      font-display: block;
      src: url('assets/outfit-500-subset.woff2') format('woff2');
    }
    @font-face {
      font-family: 'Outfit';
      font-weight: 700;
      font-style: normal;
      font-display: block;
      src: url('assets/outfit-700-subset.woff2') format('woff2');
    }
    @font-face {
      font-family: 'Outfit';
      font-weight: 800;
      font-style: normal;
      font-display: block;
      src: url('assets/outfit-800-subset.woff2') format('woff2');
    }
  </style>

  <style>
    *, *::before, *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      width: 300px;
      height: 600px;
      overflow: hidden;
    }

    #banner {
      position: relative;
      width: 300px;
      height: 600px;
      overflow: hidden;
      background-color: #fffbe5;
      font-family: 'Outfit', sans-serif;
      cursor: pointer;
      user-select: none;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    .layer {
      position: absolute;
      opacity: 0;
      will-change: transform;
    }

    #endcard-bg {
      position: absolute;
      inset: 0;
      background-color: #e8f1ff;
      z-index: 6;
      opacity: 0;
    }

    /* ── Scene 1 ──────────────────────────────────────────── */
    #scene-1-img {
      left: 0;
      top: 354px;
      width: 300px;
      height: 246px;
      overflow: hidden;
      z-index: 2;
    }
    #scene-1-img img {
      width: 100%;
      height: 100%;
      display: block;
      object-fit: cover;
    }

    /* 38px/500, centered, center at y=162.5 (text h=179 → top=73) */
    #s1-txt {
      left: 24px;
      top: 66px;
      width: 252px;
      font-size: 38px;
      font-weight: 500;
      color: #1e3c70;
      line-height: 1;
      letter-spacing: -0.38px;
      text-align: center;
      z-index: 3;
    }
    #s1-txt strong {
      font-weight: 700;
    }

    #word-stroke {
      left: 61px;
      top: 259px;
      z-index: 4;
      overflow: visible;
    }

    /* ── Scene 2 ──────────────────────────────────────────── */
    /* Full-width image in lower half */
    #scene-2-img {
      left: 0;
      top: 290px;
      width: 300px;
      height: 310px;
      overflow: hidden;
      z-index: 2;
    }
    #scene-2-img img {
      width: 100%;
      height: 100%;
      display: block;
      object-fit: cover;
    }

    /* 41px/700, centered, center at y=162 (h=70 → top=127) */
    #s23-txt {
      left: 24px;
      top: 127px;
      width: 252px;
      font-size: 41px;
      font-weight: 700;
      color: #1e3c70;
      line-height: 1.0;
      letter-spacing: -0.41px;
      text-align: center;
      z-index: 3;
    }

    /* Arrow 2: outside-left, rotate(-54deg) scaleY(-1) */
    #arrow-wrap-2 {
      left: -14px;
      top: 207px;
      width: 185px;
      height: 214px;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 4;
    }
    #arrow-inner-2 {
      transform: rotate(-54deg) scaleY(-1);
      flex: none;
      line-height: 0;
    }

    /* ── Scene 3 ──────────────────────────────────────────── */
    /* Phone image: 318px wide (overflows 47px left), left anchored at -47 */
    #scene-3-img {
      left: -47px;
      top: 372px;
      width: 318px;
      height: 228px;
      overflow: hidden;
      z-index: 2;
    }
    #scene-3-img img {
      width: 100%;
      height: 100%;
      display: block;
      object-fit: cover;
    }

    /* Arrow 3: outside-left area, rotate(40deg) */
    #arrow-wrap-3 {
      left: -14px;
      top: 217px;
      width: 209px;
      height: 193px;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 4;
    }
    #arrow-inner-3 {
      transform: rotate(40deg);
      flex: none;
      line-height: 0;
    }

    /* ── Disclaimer bar ───────────────────────────────────── */
    #disclaimer {
      left: 0;
      bottom: 0;
      width: 300px;
      height: 22px;
      background-color: #e8f1ff;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0 20px;
      z-index: 5;
    }
    #disclaimer span {
      font-size: 11px;
      font-weight: 800;
      color: #1e3c70;
      letter-spacing: 2.2px;
      text-transform: uppercase;
      line-height: 1;
      white-space: nowrap;
    }

    /* ── Endcard ──────────────────────────────────────────── */
    /* Content group centered at y=300, height=382.64 → top=109 */
    #ec-headline {
      position: absolute;
      left: 20px;
      top: 109px;
      width: 260px;
      height: 184px;
      font-size: 40px;
      font-weight: 700;
      color: #1e3c70;
      text-align: center;
      line-height: 1.16;
      letter-spacing: -0.4px;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      will-change: transform;
      z-index: 7;
    }

    #ec-btn {
      position: absolute;
      left: 35px;
      top: 353px;
      width: 230px;
      height: 57px;
      background-color: #146a5d;
      border-radius: 4px;
      padding: 18px 24px;
      box-shadow: 0 8px 14px -10px rgba(0, 0, 0, 0.55);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      opacity: 0;
      will-change: transform;
      z-index: 7;
    }

    #ec-btn-label {
      display: block;
      font-size: 30px;
      font-weight: 700;
      color: #ffffff;
      line-height: 1.05;
      letter-spacing: -0.3px;
      white-space: nowrap;
    }

    #ec-logo {
      position: absolute;
      left: 25px;
      top: 470px;
      width: 250px;
      height: 21.64px;
      opacity: 0;
      will-change: transform;
      z-index: 7;
    }
    #ec-logo img {
      width: 100%;
      height: 100%;
      display: block;
    }

    #border-ol {
      position: absolute;
      inset: 0;
      border: 1px solid rgba(0, 0, 0, 0.12);
      pointer-events: none;
      z-index: 50;
    }
  </style>
</head>
<body>

  <div id="banner">

    <div id="endcard-bg"></div>

    <!-- ── SCENE 1 ────────────────────────────────────────── -->
    <div class="layer" id="scene-1-img">
      <img src="assets/scene_1-img.png" alt="">
    </div>

    <p class="layer" id="s1-txt">¿Regalos <strong>&ldquo;gratuitos&rdquo;</strong><br>a cambio de su número de <strong>Medicare</strong>?</p>

    <svg class="layer" id="word-stroke"
         width="160" height="21"
         viewBox="0 0 102.953 16.718"
         preserveAspectRatio="none"
         style="overflow:visible;">
      <defs>
        <mask id="wm" maskUnits="userSpaceOnUse" x="-5" y="-20" width="115" height="55">
          <path id="wmp"
                d="M1.04372 12.8566C1.04372 12.8566 49.0437 -0.143382 102.544 5.35661"
                stroke="white" stroke-width="34" fill="none" stroke-linecap="round"/>
        </mask>
      </defs>
      <image href="assets/word-stroke.png"
             x="-0.25" y="-2.52" width="103" height="15"
             preserveAspectRatio="none" mask="url(#wm)"/>
    </svg>

    <!-- ── SCENE 2 ────────────────────────────────────────── -->
    <div class="layer" id="scene-2-img">
      <img src="assets/scene_2-img.jpg" alt="">
    </div>

    <!-- Shared headline for scenes 2 and 3 -->
    <p class="layer" id="s23-txt">No se confíe.<br>Es fraude.</p>

    <!-- Arrow 2: outside-left, rotate(-54deg) scaleY(-1) -->
    <div class="layer" id="arrow-wrap-2">
      <div id="arrow-inner-2">
        <svg width="207" height="77"
             viewBox="0 0 207 77"
             preserveAspectRatio="none"
             style="display:block; overflow:visible;">
          <defs>
            <mask id="am2" maskUnits="userSpaceOnUse" x="-20" y="-20" width="250" height="130">
              <path id="amp2"
                    d="M11.726 73.535C11.726 73.535 19.012 31.925 55.587 20.332C92.140 8.739 124.362 32.412 112.495 57.501C100.626 82.590 53.224 53.487 96.309 20.332C121.522 0.916 177.691 11.313 197.846 31.887"
                    stroke="white" stroke-width="48" fill="none"
                    stroke-linecap="round" stroke-linejoin="round"/>
            </mask>
          </defs>
          <image href="assets/arrow-stroke.png"
                 x="0" y="0" width="207" height="77"
                 preserveAspectRatio="none"
                 mask="url(#am2)"/>
        </svg>
      </div>
    </div>

    <!-- ── SCENE 3 ────────────────────────────────────────── -->
    <!-- Phone: 318px wide, bleeds 47px off left edge -->
    <div class="layer" id="scene-3-img">
      <img src="assets/scene_3-img.jpg" alt="">
    </div>

    <!-- Arrow 3: rotate(40deg) -->
    <div class="layer" id="arrow-wrap-3">
      <div id="arrow-inner-3">
        <svg width="207" height="77"
             viewBox="0 0 207 77"
             preserveAspectRatio="none"
             style="display:block; overflow:visible;">
          <defs>
            <mask id="am3" maskUnits="userSpaceOnUse" x="-20" y="-20" width="250" height="130">
              <path id="amp3"
                    d="M11.726 73.535C11.726 73.535 19.012 31.925 55.587 20.332C92.140 8.739 124.362 32.412 112.495 57.501C100.626 82.590 53.224 53.487 96.309 20.332C121.522 0.916 177.691 11.313 197.846 31.887"
                    stroke="white" stroke-width="48" fill="none"
                    stroke-linecap="round" stroke-linejoin="round"/>
            </mask>
          </defs>
          <image href="assets/arrow-stroke.png"
                 x="0" y="0" width="207" height="77"
                 preserveAspectRatio="none"
                 mask="url(#am3)"/>
        </svg>
      </div>
    </div>

    <!-- Disclaimer bar -->
    <div class="layer" id="disclaimer">
      <span>Un mensaje oficial de Medicare</span>
    </div>

    <!-- ── ENDCARD ─────────────────────────────────────────── -->
    <p id="ec-headline">Protéjase contra el fraude a Medicare</p>
    <div id="ec-btn">
      <span id="ec-btn-label">Aprenda más</span>
    </div>
    <div id="ec-logo">
      <img src="assets/medicare-logo.png" alt="Medicare">
    </div>

    <div id="border-ol"></div>

  </div><!-- /#banner -->

  <script src="gsap-with-ease.min.js"></script>

  <script>
    /* ── Click tag ──────────────────────────────────────────── */
    var clickTag = "";

    document.getElementById("ec-btn").addEventListener("click", function (e) {
      e.stopPropagation();
      if (clickTag) window.open(clickTag, "_blank");
    });
    document.getElementById("banner").addEventListener("click", function () {
      if (clickTag) window.open(clickTag, "_blank");
    });

    /* ── Register custom eases ──────────────────────────────── */
    CustomEase.create("fadeSlide", "M0,0 C0.22,1 0.36,1 1,1");
    CustomEase.create("snapOut",   "M0,0 C0,0 0.123,1.196 0.33,1.319 0.449,1.389 0.582,1.158 0.68,1.09 0.844,0.974 1,1 1,1");

    /* ── Stroke mask paths ──────────────────────────────────── */
    var wmp  = document.getElementById("wmp");
    var amp2 = document.getElementById("amp2");
    var amp3 = document.getElementById("amp3");
    var wlen = wmp.getTotalLength();
    var alen = amp2.getTotalLength();

    wmp.style.strokeDasharray  = wlen;
    amp2.style.strokeDasharray = alen;
    amp3.style.strokeDasharray = alen;

    /* ── Initial states ─────────────────────────────────────── */
    gsap.set("#ec-headline", { x: -10 });
    gsap.set("#ec-btn",      { scale: 0.85 });

    /* ── Timeline  |  15 s × repeat:1 = 30 s total ────────── */
    var tl = gsap.timeline({ repeat: 1, repeatDelay: 0 });

    /* ── SCENE 1  (0 – 3.5 s) ───────────────────────────────── */
    tl
      .fromTo("#disclaimer",   { opacity: 0 }, { opacity: 1,                  duration: 0.4, ease: "fadeSlide"    }, 0)
      .fromTo("#scene-1-img",  { opacity: 0, y: 20 }, { opacity: 1, y: 0,     duration: 0.5, ease: "fadeSlide"    }, 0)
      .fromTo("#s1-txt",       { opacity: 0, y: 8  }, { opacity: 1, y: 0,     duration: 0.7, ease: "fadeSlide"    }, 0.25)
      .fromTo("#word-stroke",  { opacity: 0 }, { opacity: 1,                  duration: 0.1                       }, 0.75)
      .fromTo(wmp, { strokeDashoffset: wlen }, { strokeDashoffset: 0,         duration: 0.6, ease: "power2.inOut" }, 0.75)

    /* ── SCENE 1 → 2 ─────────────────────────────────────────── */
      .to(["#s1-txt", "#scene-1-img", "#word-stroke"], { opacity: 0,          duration: 0.3, ease: "power2.inOut" }, 3.5)

    /* ── SCENE 2  (3.8 – 7.5 s) ─────────────────────────────── */
      .fromTo("#scene-2-img",  { opacity: 0 }, { opacity: 1,                  duration: 0.5, ease: "fadeSlide"    }, 3.8)
      .fromTo("#s23-txt",      { opacity: 0, x: -8 }, { opacity: 1, x: 0,    duration: 0.7, ease: "fadeSlide"    }, 4.0)
      .fromTo("#arrow-wrap-2", { opacity: 0 }, { opacity: 1,                  duration: 0.1                       }, 4)
      .fromTo(amp2, { strokeDashoffset: alen }, { strokeDashoffset: 0,        duration: 0.9, ease: "power2.inOut" }, 4)

    /* ── SCENE 2 → 3 ─────────────────────────────────────────── */
      .to(["#scene-2-img", "#arrow-wrap-2"], { opacity: 0,                    duration: 0.3, ease: "power2.inOut" }, 7.5)

    /* ── SCENE 3  (7.8 – 11.0 s) ────────────────────────────── */
      .fromTo("#scene-3-img",
        { opacity: 0, y: 40, rotation: 12, transformOrigin: "bottom center" },
        { opacity: 1, y: 0,  rotation:  0,                duration: 0.65, ease: "fadeSlide" }, 7.8)
      .fromTo("#arrow-wrap-3", { opacity: 0 }, { opacity: 1,                  duration: 0.1                       }, 8)
      .fromTo(amp3, { strokeDashoffset: alen }, { strokeDashoffset: 0,        duration: 0.9, ease: "power2.inOut" }, 8)

    /* ── SCENE 3 → ENDCARD ───────────────────────────────────── */
      .to(["#scene-3-img", "#s23-txt", "#arrow-wrap-3", "#disclaimer"], { opacity: 0, duration: 0.5, ease: "power2.inOut" }, 11.0)
      .to("#endcard-bg",    { opacity: 1,                                        duration: 0.7, ease: "power2.inOut" }, 11.2)

    /* ── ENDCARD  (11.5 – 15 s) ──────────────────────────────── */
      .to("#ec-headline",   { opacity: 1, x: 0,                                  duration: 0.7, ease: "fadeSlide"    }, 11.5)
      .to("#ec-btn",        { opacity: 1, scale: 1,                              duration: 0.4, ease: "snapOut"      }, 11.85)
      .to("#ec-logo",       { opacity: 1,                                        duration: 0.5, ease: "fadeSlide"    }, 12.1)

    /* ── Hold at 15 s, then second play (endcard holds) ──────── */
      .to({}, { duration: 0.001 }, 15);

    /* ── CTA button hover ───────────────────────────────────── */
    var ecBtn = document.getElementById("ec-btn");
    ecBtn.addEventListener("mouseenter", function () {
      gsap.to(ecBtn, { scale: 1.05, duration: 0.18, ease: "power2.out", overwrite: "auto" });
    });
    ecBtn.addEventListener("mouseleave", function () {
      gsap.to(ecBtn, { scale: 1,    duration: 0.18, ease: "power2.out", overwrite: "auto" });
    });

  </script>
</body>
</html>
