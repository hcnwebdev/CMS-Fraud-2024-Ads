<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="ad.size" content="width=728,height=90">
  <title>CMS Medicare Fraud Awareness 2026 — 728x90 — Spanish</title>

  <!-- Self-hosted Outfit subset (banner characters only, woff2) -->
  <style>
    @font-face {
      font-family: 'Outfit';
      font-weight: 700;
      font-style: normal;
      font-display: block;
      src: url('assets/outfit-700-subset.woff2') format('woff2');
    }
    @font-face {
      font-family: 'Outfit';
      font-weight: 800;
      font-style: normal;
      font-display: block;
      src: url('assets/outfit-800-subset.woff2') format('woff2');
    }
  </style>

  <style>
    /* ── Reset ──────────────────────────────────────────────── */
    *, *::before, *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      width: 728px;
      height: 90px;
      overflow: hidden;
    }

    /* ── Banner shell ─────────────────────────────────────── */
    #banner {
      position: relative;
      width: 728px;
      height: 90px;
      overflow: hidden;
      background-color: #d1dbe5; /* fallback */
      font-family: 'Outfit', sans-serif;
      cursor: pointer;
      user-select: none;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    /* ── All layers: absolute-positioned, start invisible ──── */
    .layer {
      position: absolute;
      opacity: 0;
      will-change: transform;
    }

    /* ── Background (shared across all scenes) ────────────── */
    #bg {
      inset: 0;
      width: 728px;
      height: 90px;
    }
    #bg img {
      width: 100%;
      height: 100%;
      display: block;
    }

    /* ── Scene 1 ──────────────────────────────────────────── */
    /* Image: right column, full banner height */
    #s1-img {
      left: 512px;
      top: 0;
      width: 138px;
      height: 90px;
      overflow: hidden;
    }
    #s1-img img {
      width: 100%;
      height: 100%;
      display: block;
    }

    /* Text: left column, fills content area (90 − 22 = 68px) */
    #s1-txt {
      left: 20px;
      top: 0;
      width: 423px;
      height: 68px;
      font-size: 28px;
      font-weight: 700;
      color: #063560;
      line-height: 1.05;
      letter-spacing: -0.28px;
      text-align: left;
      display: flex;
      align-items: center;
    }

    /* ── Scene 2 ──────────────────────────────────────────── */
    /* Image: right column, full banner height */
    #s2-img {
      left: 502px;
      top: 0;
      width: 226px;
      height: 90px;
      overflow: hidden;
    }
    #s2-img img {
      width: 100%;
      height: 100%;
      display: block;
    }

    /* Text: left column — same slot as scene 1 text */
    #s2-txt {
      left: 20px;
      top: 0;
      width: 442px;
      height: 68px;
      font-size: 28px;
      font-weight: 700;
      color: #063560;
      line-height: 1.05;
      letter-spacing: -0.28px;
      text-align: left;
      display: flex;
      align-items: center;
    }

    /* ── Scene 3 ──────────────────────────────────────────── */
    /* Full-width centered text — no image */
    #s3-txt {
      left: 50%;
      top: 0;
      width: 680px;
      height: 68px;
      font-size: 28px;
      font-weight: 700;
      color: #063560;
      line-height: 1.05;
      letter-spacing: -0.28px;
      text-align: center;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* ── Scene 4 / Endcard ────────────────────────────────── */
    /* No disclaimer in endcard — headline + logo share the left slot.
       Headline fills full 90px height (vertically centered via flex).
       Logo and button use precise top offsets to center in 90px. */

    /* Endcard headline (endcard state A — left slot) */
    #ec-headline {
      left: 20px;
      top: 0;
      width: 481px;
      height: 90px;
      font-size: 28px;
      font-weight: 700;
      color: #063560;
      line-height: 1.05;
      letter-spacing: -0.28px;
      display: flex;
      align-items: center;
    }

    /* Endcard logo (endcard state B — same left slot, replaces headline) */
    #ec-logo {
      left: 20px;
      top: 31px; /* (90 − 28) / 2 = 31 — vertically centered */
      width: 320px;
      height: 28px;
      flex-shrink: 0;
    }
    #ec-logo img {
      width: 100%;
      height: 100%;
      display: block;
    }

    /* Endcard button (persistent across both endcard states) */
    #ec-btn {
      left: 534px;
      top: 23px; /* (90 − 44) / 2 = 23 — vertically centered */
      width: 174px;
      background-color: #146a5d;
      padding: 10px 20px;
      border-radius: 4px;
      box-shadow: 0 8px 14px -10px rgba(0, 0, 0, 0.55);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }

    #ec-btn-label {
      display: block;
      font-size: 22px;
      font-weight: 700;
      color: #ffffff;
      line-height: 1.05;
      letter-spacing: -0.22px;
      white-space: nowrap;
    }

    /* ── Disclaimer bar (728×22 — left-aligned text) ─────── */
    #disclaimer {
      left: 0;
      bottom: 0;
      width: 728px;
      height: 22px;
      background-color: #1e3c70;
      display: flex;
      align-items: center;
      padding: 0 20px;
    }

    #disclaimer span {
      font-size: 11px;
      font-weight: 800;
      color: #ffffff;
      letter-spacing: 2.2px;
      text-transform: uppercase;
      line-height: 1;
      white-space: nowrap;
    }

    /* ── Banner border overlay ────────────────────────────── */
    #border-ol {
      position: absolute;
      inset: 0;
      border: 1px solid rgba(0, 0, 0, 0.12);
      pointer-events: none;
      z-index: 50;
    }
  </style>
</head>
<body>

  <div id="banner">

    <!-- Shared background (all scenes) -->
    <div class="layer" id="bg">
      <img src="assets/background.jpg" alt="">
    </div>
    
    <!-- Disclaimer bar (scenes 1–3 only) -->
    <div class="layer" id="disclaimer">
      <span>un mensaje oficial de medicare</span>
    </div>

    <!-- Scene 1: Wallet / Medicare card visual (right column) -->
    <div class="layer" id="s1-img">
      <img src="assets/scene_1-img.webp" alt="">
    </div>
    <p class="layer" id="s1-txt">Proteja su tarjeta de Medicare…</p>

    <!-- Scene 2: House key visual (right column) -->
    <div class="layer" id="s2-img">
      <img src="assets/scene_2-img.webp" alt="">
    </div>
    <p class="layer" id="s2-txt">… como si fuera la llave de su casa.</p>

    <!-- Scene 3: Text-only message (full width, centered) -->
    <p class="layer" id="s3-txt">Solo comparta su número con proveedores conocidos.</p>

    <!-- Endcard state A: headline + button -->
    <p class="layer" id="ec-headline">Protéjase contra el fraude a Medicare&#x200B;</p>

    <!-- Endcard state B: logo replaces headline, button persists -->
    <div class="layer" id="ec-logo">
      <img src="assets/medicare-logo.png" alt="Medicare">
    </div>

    <!-- Endcard button (appears with headline, stays through logo) -->
    <div class="layer" id="ec-btn">
      <span id="ec-btn-label">Aprenda más</span>
    </div>

    <!-- Border -->
    <div id="border-ol"></div>

  </div><!-- /#banner -->

  <!-- ── GSAP 3 + CustomEase (combined local) ─────────── -->
  <script src="gsap-with-ease.min.js"></script>

  <script>
    /* ── Click tag ──────────────────────────────────────────── */
    var clickTag = "";

    document.getElementById("ec-btn").addEventListener("click", function (e) {
      e.stopPropagation();
      if (clickTag) window.open(clickTag, "_blank");
    });
    document.getElementById("banner").addEventListener("click", function () {
      if (clickTag) window.open(clickTag, "_blank");
    });

    /* ── Register custom eases ──────────────────────────────── */
    CustomEase.create("fadeSlide", "M0,0 C0.22,1 0.36,1 1,1");   /* smooth ease-out for entrances */
    CustomEase.create("snapOut",   "M0,0 C0,0 0.123,1.196 0.33,1.319 0.449,1.389 0.582,1.158 0.68,1.09 0.844,0.974 1,1 1,1"); /* snappy overshoot for CTA */

    /* ── Initial states ─────────────────────────────────────── */
    gsap.set("#s1-img",      { y: 100 });
    gsap.set("#s2-img",      { x: 250 });
    /* Text layers: y drift for entrance (fixed left:20px — no xPercent) */
    gsap.set("#s1-txt",      { y: 10 });
    gsap.set("#s2-txt",      { y: 10 });
    /* Scene 3: center horizontally via xPercent; subtle scale for entrance */
    gsap.set("#s3-txt",      { xPercent: -50, scale: 0.95 });
    /* Endcard */
    gsap.set("#ec-headline", { y: 10 });
    gsap.set("#ec-btn",      { scale: 0.85 });

    /* ── Timeline  |  15 s × repeat: 1 = 30 s total ────────── */
    var tl = gsap.timeline({ repeat: 1, repeatDelay: 0 });

    /* ── SCENE 1  (0 s – 3.5 s) ──────────────────────────── */
    tl
      .to("#bg",         { opacity: 1, duration: 0.6, ease: "fadeSlide" }, 0)
      .to("#s1-img",     { opacity: 1, y: 0, duration: 0.4, ease: "fadeSlide" }, 0.3)
      .to("#s1-txt",     { opacity: 1, y: 0, duration: 0.7, ease: "fadeSlide" }, 0.6)
      .to("#disclaimer", { opacity: 1, duration: 0.5, ease: "fadeSlide" }, 0.2)

    /* ── SCENE 1 → 2 ────────────────────────────────────── */
      .to(["#s1-img", "#s1-txt"], { opacity: 0, duration: 0.4, ease: "power2.inOut" }, 2.9)

    /* ── SCENE 2  (3.5 s – 7 s) ──────────────────────────── */
      .to("#s2-img",     { opacity: 1, x: 0, duration: 0.5, ease: "fadeSlide" }, 3.5)
      .to("#s2-txt",     { opacity: 1, y: 0, duration: 0.7, ease: "fadeSlide" }, 4.0)

    /* ── SCENE 2 → 3 ────────────────────────────────────── */
      .to(["#s2-img", "#s2-txt"], { opacity: 0, duration: 0.4, ease: "power2.inOut" }, 6.3)

    /* ── SCENE 3  (7 s – 10.5 s) ─────────────────────────── */
      .to("#s3-txt",     { opacity: 1, scale: 1, duration: 0.7, ease: "fadeSlide" }, 7.0)

    /* ── SCENE 3 → ENDCARD ──────────────────────────────── */
      .to(["#s3-txt", "#disclaimer"], { opacity: 0, duration: 0.4, ease: "power2.inOut" }, 10.0)

    /* ── ENDCARD STATE A: headline + button  (10.5 s – 13 s) ─ */
      .to("#ec-headline", { opacity: 1, y: 0, duration: 0.7, ease: "fadeSlide" }, 10.5)
      .to("#ec-btn",      { opacity: 1, scale: 1, duration: 0.4, ease: "snapOut" }, 10.75)

    /* ── ENDCARD STATE B: logo replaces headline  (13 s – 15 s) */
      .to("#ec-headline", { opacity: 0, duration: 0.4, ease: "power2.inOut" }, 13.0)
      .to("#ec-logo",     { opacity: 1, duration: 0.5, ease: "fadeSlide" }, 13.4)

    /* ── Hold at 15 s, then loop ─────────────────────────── */
      .to({}, { duration: 0.001 }, 15);

    /* ── CTA button hover ───────────────────────────────────── */
    var ecBtn = document.getElementById("ec-btn");
    ecBtn.addEventListener("mouseenter", function () {
      gsap.to(ecBtn, { scale: 1.05, duration: 0.18, ease: "power2.out", overwrite: "auto" });
    });
    ecBtn.addEventListener("mouseleave", function () {
      gsap.to(ecBtn, { scale: 1,    duration: 0.18, ease: "power2.out", overwrite: "auto" });
    });

  </script>
</body>
</html>
