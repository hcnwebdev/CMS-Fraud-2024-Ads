<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="ad.size" content="width=300,height=600">
  <title>CMS Medicare Fraud Awareness 2026 — 300x600 — Spanish</title>

  <!-- Self-hosted Outfit subset (banner characters only, woff2) -->
  <style>
    @font-face {
      font-family: 'Outfit';
      font-weight: 700;
      font-style: normal;
      font-display: block;
      src: url('assets/outfit-700-subset.woff2') format('woff2');
    }
    @font-face {
      font-family: 'Outfit';
      font-weight: 800;
      font-style: normal;
      font-display: block;
      src: url('assets/outfit-800-subset.woff2') format('woff2');
    }
  </style>

  <style>
    /* ── Reset ──────────────────────────────────────────────── */
    *, *::before, *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      width: 300px;
      height: 600px;
      overflow: hidden;
    }

    /* ── Banner shell ─────────────────────────────────────── */
    #banner {
      position: relative;
      width: 300px;
      height: 600px;
      overflow: hidden;
      background-color: #d1dbe5; /* fallback */
      font-family: 'Outfit', sans-serif;
      cursor: pointer;
      user-select: none;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    /* ── All layers: absolute-positioned, start invisible ──── */
    .layer {
      position: absolute;
      opacity: 0;
      will-change: transform;
    }

    /* ── Background (shared across all scenes) ────────────── */
    #bg {
      inset: 0;
      width: 300px;
      height: 600px;
    }
    #bg img {
      width: 100%;
      height: 100%;
      display: block;
    }

    /* ── Scene 1 ──────────────────────────────────────────── */
    #s1-img {
      left: 0;
      top: 230px;
      width: 300px;
      height: 300px;
      overflow: hidden;
    }
    #s1-img img {
      width: 100%;
      height: 100%;
      display: block;
    }

    #s1-txt {
      /* left: 50% + xPercent: -50 (GSAP) = centered */
      left: 50%;
      top: 88px;
      width: 208px;
      font-size: 40px;
      font-weight: 700;
      color: #063560;
      line-height: 1.16;
      letter-spacing: -0.4px;
      text-align: center;
    }

    /* ── Scene 2 ──────────────────────────────────────────── */
    #s2-img {
      left: 0;
      top: 70px;
      width: 300px;
      height: 389px;
      overflow: hidden;
    }
    #s2-img img {
      width: 100%;
      height: 100%;
      display: block;
    }

    #s2-txt {
      /* left: 50% + xPercent: -50 (GSAP) = centered */
      left: 50%;
      top: 364px;
      width: 240px;
      font-size: 40px;
      font-weight: 700;
      color: #063560;
      line-height: 1.16;
      letter-spacing: -0.4px;
      text-align: center;
    }

    /* ── Scene 3 ──────────────────────────────────────────── */
    #s3-txt {
      /* left: 50% + xPercent: -50 (GSAP) = centered horizontally
         top: 289px + yPercent: -50 (GSAP) = centered in 578px content area */
      left: 50%;
      top: 289px;
      width: 239px;
      font-size: 40px;
      font-weight: 700;
      color: #063560;
      line-height: 1.16;
      letter-spacing: -0.4px;
      text-align: center;
    }

    /* ── Scene 4 / Endcard ────────────────────────────────── */
    /* Layout wrapper — children animate individually */
    #endcard {
      position: absolute;
      left: 50%;
      top: 50%;
      /* xPercent: -50, yPercent: -50 applied via GSAP */
      width: 260px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 60px;
      will-change: transform;
    }

    /* Endcard children: start invisible, animate in individually */
    .ec-item {
      opacity: 0;
      will-change: transform;
    }

    #ec-headline {
      width: 100%;
      font-size: 40px;
      font-weight: 700;
      color: #063560;
      line-height: 1.16;
      letter-spacing: -0.4px;
      text-align: center;
    }

    #ec-btn {
      background-color: #146a5d;
      padding: 18px 24px;
      border-radius: 4px;
      box-shadow: 0 8px 14px -10px rgba(0, 0, 0, 0.55);
      cursor: pointer;
    }

    #ec-btn-label {
      display: block;
      font-size: 30px;
      font-weight: 700;
      color: #ffffff;
      line-height: 1.05;
      letter-spacing: -0.3px;
      white-space: nowrap;
    }

    #ec-logo {
      width: 250px;
      height: 22px;
      flex-shrink: 0;
    }
    #ec-logo img {
      width: 100%;
      height: 100%;
      display: block;
    }

    /* ── Disclaimer bar ───────────────────────────────────── */
    #disclaimer {
      left: 0;
      bottom: 0;
      width: 300px;
      height: 22px;
      background-color: #1e3c70;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0 20px;
    }

    #disclaimer span {
      font-size: 11px;
      font-weight: 800;
      color: #ffffff;
      letter-spacing: 2.2px;
      text-transform: uppercase;
      text-align: center;
      line-height: 1;
      white-space: nowrap;
    }

    /* ── Banner border overlay ────────────────────────────── */
    #border-ol {
      position: absolute;
      inset: 0;
      border: 1px solid rgba(0, 0, 0, 0.12);
      pointer-events: none;
      z-index: 50;
    }
  </style>
</head>
<body>

  <div id="banner">

    <!-- Shared background (all scenes) -->
    <div class="layer" id="bg">
      <img src="assets/background.jpg" alt="">
    </div>

    <!-- Scene 1: Wallet / Medicare card visual -->
    <div class="layer" id="s1-img">
      <img src="assets/scene_1-img.webp" alt="">
    </div>
    <p class="layer" id="s1-txt">Proteja su tarjeta de Medicare…</p>

    <!-- Scene 2: House key visual -->
    <div class="layer" id="s2-img">
      <img src="assets/scene_2-img.webp" alt="">
    </div>
    <p class="layer" id="s2-txt">… como si fuera la llave de su casa.</p>

    <!-- Scene 3: Text-only message -->
    <p class="layer" id="s3-txt">Solo comparta su número con proveedores conocidos.</p>

    <!-- Scene 4 / Endcard -->
    <div id="endcard">
      <p class="ec-item" id="ec-headline">Protéjase contra<br>el fraude<br>a Medicare&#x200B;</p>
      <div class="ec-item" id="ec-btn">
        <span id="ec-btn-label">Aprenda más</span>
      </div>
      <div class="ec-item" id="ec-logo">
        <img src="assets/medicare-logo.png" alt="Medicare">
      </div>
    </div>

    <!-- Disclaimer bar (persistent) -->
    <div class="layer" id="disclaimer">
      <span>un mensaje oficial de medicare</span>
    </div>

    <!-- Border -->
    <div id="border-ol"></div>

  </div><!-- /#banner -->

  <!-- ── GSAP 3 + CustomEase (combined local) ─────────── -->
  <script src="gsap-with-ease.min.js"></script>

  <script>
    /* ── Click tag ──────────────────────────────────────────── */
    var clickTag = "";

    document.getElementById("ec-btn").addEventListener("click", function (e) {
      e.stopPropagation();
      if (clickTag) window.open(clickTag, "_blank");
    });
    document.getElementById("banner").addEventListener("click", function () {
      if (clickTag) window.open(clickTag, "_blank");
    });

    /* ── Register custom eases ──────────────────────────────── */
    CustomEase.create("fadeSlide", "M0,0 C0.22,1 0.36,1 1,1");   /* smooth ease-out for entrances */
    CustomEase.create("snapOut",   "M0,0 C0,0 0.123,1.196 0.33,1.319 0.449,1.389 0.582,1.158 0.68,1.09 0.844,0.974 1,1 1,1"); /* snappy overshoot for CTA */

    /* ── Initial states ─────────────────────────────────────── */
    gsap.set("#s1-img",      { y: 100 });
    gsap.set("#s2-img",      { x: 250 });
    gsap.set("#s1-txt",      { xPercent: -50, y: 10 });
    gsap.set("#s2-txt",      { xPercent: -50, y: 10 });
    gsap.set("#s3-txt",      { xPercent: -50, yPercent: -50, scale: 0.95 });
    gsap.set("#endcard",     { xPercent: -50, yPercent: -50 });
    gsap.set("#ec-headline", { y: 10 });
    gsap.set("#ec-btn",      { scale: 0.85 });

    /* ── Timeline  |  15 s × repeat: 1 = 30 s total ────────── */
    var tl = gsap.timeline({ repeat: 1, repeatDelay: 0 });

    /* ── SCENE 1  (0 s – 3.5 s) ──────────────────────────── */
    tl
      .to("#bg",         { opacity: 1, duration: 0.6, ease: "fadeSlide" }, 0)
      .to("#s1-img",     { opacity: 1, y: 0, duration: 0.4, ease: "fadeSlide" }, 0.3)
      .to("#s1-txt",     { opacity: 1, y: 0, duration: 0.7, ease: "fadeSlide" }, 0.6)
      .to("#disclaimer", { opacity: 1, duration: 0.5, ease: "fadeSlide" }, 0.2)

    /* ── SCENE 1 → 2 ────────────────────────────────────── */
      .to(["#s1-img", "#s1-txt"], { opacity: 0, duration: 0.4, ease: "power2.inOut" }, 2.9)

    /* ── SCENE 2  (3.5 s – 7 s) ──────────────────────────── */
      .to("#s2-img",     { opacity: 1, x: 0, duration: 0.5, ease: "fadeSlide" }, 3.5)
      .to("#s2-txt",     { opacity: 1, y: 0, duration: 0.7, ease: "fadeSlide" }, 4.0)

    /* ── SCENE 2 → 3 ────────────────────────────────────── */
      .to(["#s2-img", "#s2-txt"], { opacity: 0, duration: 0.4, ease: "power2.inOut" }, 6.3)

    /* ── SCENE 3  (7 s – 10.5 s) ─────────────────────────── */
      .to("#s3-txt",     { opacity: 1, scale: 1, duration: 0.7, ease: "fadeSlide" }, 7.0)

    /* ── SCENE 3 → 4 ────────────────────────────────────── */
      .to(["#s3-txt", "#disclaimer"], { opacity: 0, duration: 0.4, ease: "power2.inOut" }, 10.0)

    /* ── SCENE 4 / ENDCARD  (10.5 s – 15 s) ──────────────── */
      .to("#ec-headline", { opacity: 1, y: 0, duration: 0.7, ease: "fadeSlide" }, 10.5)
      .to("#ec-btn",      { opacity: 1, scale: 1, duration: 0.4, ease: "snapOut" }, 10.75)
      .to("#ec-logo",     { opacity: 1, duration: 0.5, ease: "fadeSlide" }, 11.25)

    /* ── Hold endcard at 15 s, then loop ─────────────────── */
      .to({}, { duration: 0.001 }, 15);

    /* ── CTA button hover ───────────────────────────────────── */
    var ecBtn = document.getElementById("ec-btn");
    ecBtn.addEventListener("mouseenter", function () {
      gsap.to(ecBtn, { scale: 1.05, duration: 0.18, ease: "power2.out", overwrite: "auto" });
    });
    ecBtn.addEventListener("mouseleave", function () {
      gsap.to(ecBtn, { scale: 1,    duration: 0.18, ease: "power2.out", overwrite: "auto" });
    });

  </script>
</body>
</html>
