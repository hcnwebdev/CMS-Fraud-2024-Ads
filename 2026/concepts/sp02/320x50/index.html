<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="ad.size" content="width=320,height=50">
  <title>CMS Medicare Fraud Awareness — 320x50 — Spanish</title>

  <!-- Self-hosted Outfit subset (banner characters only, woff2) -->
  <style>
    @font-face {
      font-family: 'Outfit';
      font-weight: 700;
      font-style: normal;
      font-display: block;
      src: url('assets/outfit-700-subset.woff2') format('woff2');
    }
    @font-face {
      font-family: 'Outfit';
      font-weight: 800;
      font-style: normal;
      font-display: block;
      src: url('assets/outfit-800-subset.woff2') format('woff2');
    }
  </style>

  <style>
    /* ── Reset ──────────────────────────────────────────────── */
    *, *::before, *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      width: 320px;
      height: 50px;
      overflow: hidden;
    }

    /* ── Banner shell ─────────────────────────────────────── */
    #banner {
      position: relative;
      width: 320px;
      height: 50px;
      overflow: hidden;
      background: radial-gradient(30% 300% at 86% 58%, #193566 0%, #0A1528 100%);
      font-family: 'Outfit', sans-serif;
      cursor: pointer;
      user-select: none;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    /* ── All layers: absolute-positioned, start invisible ──── */
    .layer {
      position: absolute;
      opacity: 0;
      will-change: transform;
    }

    /* ── Disclaimer (frame 1 — centered, no bar) ──────────── */
    /* Vertically centered: top = (50 − 22) / 2 = 14 px       */
    #disclaimer {
      left: 0;
      top: 14px;
      width: 320px;
      height: 22px;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0 20px;
    }

    #disclaimer span {
      font-size: 11px;
      font-weight: 800;
      color: #e8f1ff;
      letter-spacing: 2.2px;
      text-transform: uppercase;
      text-align: center;
      line-height: 1;
      white-space: nowrap;
    }

    /* ── Endcard background overlay ──────────────────────── */
    #endcard-bg {
      position: absolute;
      inset: 0;
      background-color: #1e3c70;
      z-index: 6;
      opacity: 0;
    }

    /* ── Circles ─────────────────────────────────────────── */
    #circles {
      left: 226px;
      top: -20px;
      width: 98px;
      height: 98px;
      z-index: 1;
      transform-origin: 50% 50%;
    }

    /* ── Scene image blocks ──────────────────────────────── */
    #img-01 {
      left: 255px;
      top: 0;
      width: 85px;
      height: 50px;
      overflow: hidden;
      z-index: 2;
    }
    #img-01 img { width: 100%; height: 100%; display: block; object-fit: cover; }

    #img-02 {
      left: 260px;
      top: 0;
      width: 60px;
      height: 50px;
      overflow: hidden;
      z-index: 2;
    }
    #img-02 img { width: 100%; height: 100%; display: block; object-fit: cover; }

    /* ── Scene text blocks ────────────────────────────────── */
    #s1-txt {
      left: 14px;
      top: 0;
      width: 206px;
      height: 50px;
      font-size: 12px;
      font-weight: 700;
      color: #ffffff;
      line-height: 1;
      letter-spacing: 0.12px;
      display: flex;
      align-items: center;
      z-index: 3;
    }

    #s2-txt {
      left: 14px;
      top: 0;
      width: 194px;
      height: 50px;
      font-size: 12px;
      font-weight: 700;
      color: #ffffff;
      line-height: 1;
      letter-spacing: 0.12px;
      display: flex;
      align-items: center;
      z-index: 3;
    }

    #s3-txt {
      left: 14px;
      top: 0;
      width: 194px;
      height: 50px;
      font-size: 22px;
      font-weight: 700;
      color: #ffffff;
      line-height: 1;
      letter-spacing: 0.22px;
      display: flex;
      align-items: center;
      z-index: 3;
    }

    /* ── Popup images ─────────────────────────────────────── */
    #popup-1 {
      left: 238px;
      top: 24px;
      width: 25px;
      height: 25px;
      z-index: 4;
    }
    #popup-1 img { width: 100%; height: 100%; display: block; }

    #popup-2 {
      left: 225px;
      top: 0;
      width: 22px;
      height: 22px;
      z-index: 4;
    }
    #popup-2 img { width: 100%; height: 100%; display: block; }

    #popup-3 {
      left: 220px;
      top: 5px;
      width: 36px;
      height: 36px;
      z-index: 4;
    }
    #popup-3 img { width: 100%; height: 100%; display: block; }

    #popup-4 {
      left: 185px;
      top: 0;
      width: 51px;
      height: 51px;
      z-index: 4;
    }
    #popup-4 img { width: 100%; height: 100%; display: block; }

    /* ── Endcard content ──────────────────────────────────── */
    #endcard {
      position: absolute;
      left: 0;
      top: 0;
      width: 320px;
      height: 50px;
      z-index: 7;
    }

    .ec-item {
      opacity: 0;
      will-change: transform;
    }

    #ec-headline {
      position: absolute;
      left: 14px;
      top: 0;
      width: 189px;
      height: 50px;
      font-size: 18px;
      font-weight: 700;
      color: #ffffff;
      line-height: 1;
      letter-spacing: -0.18px;
      display: flex;
      align-items: center;
    }

    #ec-logo {
      position: absolute;
      left: 14px;
      top: 50%;
      width: 140px;
      height: 12px;
      flex-shrink: 0;
    }
    #ec-logo img { width: 100%; height: 100%; display: block; }

    #ec-btn {
      position: absolute;
      left: 203px;
      top: 50%;
      background-color: #e74c3c;
      padding: 8px 10px;
      border-radius: 4px;
      box-shadow: 0 8px 14px -10px rgba(0, 0, 0, 0.55);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }

    #ec-btn-label {
      display: block;
      font-size: 13px;
      font-weight: 700;
      color: #ffffff;
      line-height: 1;
      letter-spacing: -0.13px;
      white-space: nowrap;
    }

    /* ── Banner border overlay ────────────────────────────── */
    #border-ol {
      position: absolute;
      inset: 0;
      border: 1px solid rgba(0, 0, 0, 0.12);
      pointer-events: none;
      z-index: 50;
    }
  </style>
</head>
<body>

  <div id="banner">

    <!-- Disclaimer (frame 1 only — fades out before scene 1) -->
    <div class="layer" id="disclaimer">
      <span>un mensaje oficial de medicare</span>
    </div>

    <!-- Endcard background overlay -->
    <div id="endcard-bg"></div>

    <!-- Circles (rotating decorative element) -->
    <img class="layer" id="circles" src="assets/circles.svg" alt="">

    <!-- Scene 1 & 2: main person photo -->
    <div class="layer" id="img-01">
      <img src="assets/img_01_2x.webp" alt="">
    </div>

    <!-- Scene 3: hand photo (slides in from right) -->
    <div class="layer" id="img-02">
      <img src="assets/img_02_2x.webp" alt="">
    </div>

    <!-- Scene texts -->
    <p class="layer" id="s1-txt">Si recibe una llamada, texto o correo electrónico ofreciéndole regalos...</p>
    <p class="layer" id="s2-txt">... o servicios gratuitos a cambio de su número de Medicare</p>
    <p class="layer" id="s3-txt">¡Es una estafa!</p>

    <!-- Popup images -->
    <div class="layer" id="popup-1"><img src="assets/popup-img-1.svg" alt=""></div>
    <div class="layer" id="popup-2"><img src="assets/popup-img-2.svg" alt=""></div>
    <div class="layer" id="popup-3"><img src="assets/popup-img-3.svg" alt=""></div>
    <div class="layer" id="popup-4"><img src="assets/popup-img-4.svg" alt=""></div>

    <!-- Endcard: phase 1 (headline) → phase 2 (logo), button persists -->
    <div id="endcard">
      <p class="ec-item" id="ec-headline">Protéjase contra el fraude a Medicare</p>
      <div class="ec-item" id="ec-logo">
        <img src="assets/medicare-logo.png" alt="Medicare">
      </div>
      <div class="ec-item" id="ec-btn">
        <span id="ec-btn-label">Aprenda más</span>
      </div>
    </div>

    <!-- Border -->
    <div id="border-ol"></div>

  </div><!-- /#banner -->

  <!-- ── GSAP 3 + CustomEase (combined local) ─────────── -->
  <script src="gsap-with-ease.min.js"></script>

  <script>
    /* ── Click tag ──────────────────────────────────────────── */
    var clickTag = "";

    document.getElementById("ec-btn").addEventListener("click", function (e) {
      e.stopPropagation();
      if (clickTag) window.open(clickTag, "_blank");
    });
    document.getElementById("banner").addEventListener("click", function () {
      if (clickTag) window.open(clickTag, "_blank");
    });

    /* ── Register custom eases ──────────────────────────────── */
    CustomEase.create("fadeSlide", "M0,0 C0.22,1 0.36,1 1,1");
    CustomEase.create("snapOut",   "M0,0 C0,0 0.123,1.196 0.33,1.319 0.449,1.389 0.582,1.158 0.68,1.09 0.844,0.974 1,1 1,1");

    /* ── Initial states ─────────────────────────────────────── */
    gsap.set("#s1-txt",      { y: 4 });
    gsap.set("#s2-txt",      { y: 4 });
    gsap.set("#s3-txt",      { y: 4 });
    gsap.set("#popup-1",     { y: 3, scale: 0.9 });
    gsap.set("#popup-2",     { y: 3, scale: 0.9 });
    gsap.set("#popup-3",     { y: 3, scale: 0.9 });
    gsap.set("#popup-4",     { scale: 0.9 });
    gsap.set("#ec-btn",      { yPercent: -50, scale: 0.85 });
    gsap.set("#ec-logo",     { yPercent: -50 });
    gsap.set("#ec-headline", { x: -8 });

    /* ── Circles: continuous rotation ─────────────────────── */
    gsap.to("#circles", { rotation: 360, duration: 50, ease: "none", repeat: -1 });

    /* ── Timeline  |  15.5 s × repeat: 1 = 31 s total ────────── */
    var tl = gsap.timeline({ repeat: 1, repeatDelay: 0 });

    /* ── FRAME 1: Disclaimer only  (0 s – 2 s) ──────────────── */
    tl
      .to("#disclaimer",   { opacity: 1,                                        duration: 0.5, ease: "fadeSlide"    }, 0)
      .to("#disclaimer",   { opacity: 0,                                        duration: 0.4, ease: "power2.inOut" }, 1.6)

    /* ── SCENE 1  (2 s – 5 s) ────────────────────────────────── */
      .to("#circles",      { opacity: 1,                                        duration: 0.4, ease: "fadeSlide"    }, 2.0)
      .fromTo("#img-01",   { x: 90, opacity: 0 }, { x: 0, opacity: 1,          duration: 0.4, ease: "fadeSlide"    }, 2.0)
      .to("#s1-txt",       { opacity: 1, y: 0,                                  duration: 0.7, ease: "fadeSlide"    }, 2.25)
      .to("#popup-1",      { opacity: 1, y: 0, scale: 1,                        duration: 0.4, ease: "snapOut"      }, 2.75)
      .to("#popup-2",      { opacity: 1, y: 0, scale: 1,                        duration: 0.4, ease: "snapOut"      }, 3.5)
      .to(["#popup-1", "#popup-2"], { opacity: 0,                               duration: 0.1, ease: "power2.inOut" }, 4.7)

    /* ── SCENE 1 → 2 ──────────────────────────────────────── */
      .to("#s1-txt",       { opacity: 0,                                        duration: 0.3, ease: "power2.inOut" }, 5.0)

    /* ── SCENE 2  (5 s – 8 s) ────────────────────────────────── */
      .to("#s2-txt",       { opacity: 1, y: 0,                                  duration: 0.7, ease: "fadeSlide"    }, 5.25)
      .to("#popup-3",      { opacity: 1, y: 0, scale: 1,                        duration: 0.4, ease: "snapOut"      }, 5.5)
      .to("#popup-3",      { opacity: 0,                                        duration: 0.1, ease: "power2.inOut" }, 7.7)

    /* ── SCENE 2 → 3 ──────────────────────────────────────── */
      .to("#s2-txt",       { opacity: 0,                                        duration: 0.3, ease: "power2.inOut" }, 8.0)
      .to("#img-01",       { x: -20,                                            duration: 0.3, ease: "power2.inOut" }, 8.1)

    /* ── SCENE 3  (8.5 s – 11 s) ────────────────────────────── */
      .fromTo("#img-02",   { x: 65, opacity: 0 }, { x: 0, opacity: 1,          duration: 0.4, ease: "fadeSlide"    }, 8.5)
      .to("#s3-txt",       { opacity: 1, y: 0,                                  duration: 0.7, ease: "fadeSlide"    }, 8.75)
      .to("#popup-4",      { opacity: 1, scale: 1,                              duration: 0.4, ease: "snapOut"      }, 9.0)
      .to("#popup-4",      { opacity: 0,                                        duration: 0.2, ease: "power2.inOut" }, 10.8)

    /* ── SCENE 3 → ENDCARD ──────────────────────────────────── */
      .to(["#s3-txt", "#img-01", "#img-02", "#circles"], { opacity: 0,          duration: 0.5, ease: "power2.inOut" }, 11.0)
      .to("#endcard-bg",   { opacity: 1,                                        duration: 0.7, ease: "power2.inOut" }, 11.2)

    /* ── ENDCARD phase 1: headline + button  (11.5 s) ────────── */
      .to("#ec-headline",  { opacity: 1, x: 0,                                  duration: 0.7, ease: "fadeSlide"    }, 11.5)
      .to("#ec-btn",       { opacity: 1, scale: 1,                              duration: 0.4, ease: "snapOut"      }, 11.75)

    /* ── ENDCARD phase 2: swap headline → logo  (13 s) ─────────── */
      .to("#ec-headline",  { opacity: 0,                                        duration: 0.4, ease: "power2.inOut" }, 13.0)
      .to("#ec-logo",      { opacity: 1,                                        duration: 0.5, ease: "fadeSlide"    }, 13.2)

    /* ── Hold at 15.5 s, then loop ───────────────────────────── */
      .to({}, { duration: 0.001 }, 15.5);

    /* ── CTA button hover ───────────────────────────────────── */
    var ecBtn = document.getElementById("ec-btn");
    ecBtn.addEventListener("mouseenter", function () {
      gsap.to(ecBtn, { scale: 1.05, duration: 0.18, ease: "power2.out", overwrite: "auto" });
    });
    ecBtn.addEventListener("mouseleave", function () {
      gsap.to(ecBtn, { scale: 1,    duration: 0.18, ease: "power2.out", overwrite: "auto" });
    });

  </script>
</body>
</html>
