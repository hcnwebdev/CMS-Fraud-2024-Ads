<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="ad.size" content="width=728,height=90">
  <title>CMS Medicare Fraud Awareness — 728x90 — Spanish</title>

  <!-- Self-hosted Outfit subset (banner characters only, woff2) -->
  <style>
    @font-face {
      font-family: 'Outfit';
      font-weight: 700;
      font-style: normal;
      font-display: block;
      src: url('assets/outfit-700-subset.woff2') format('woff2');
    }
    @font-face {
      font-family: 'Outfit';
      font-weight: 800;
      font-style: normal;
      font-display: block;
      src: url('assets/outfit-800-subset.woff2') format('woff2');
    }
  </style>

  <style>
    /* ── Reset ──────────────────────────────────────────────── */
    *, *::before, *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      width: 728px;
      height: 90px;
      overflow: hidden;
    }

    /* ── Banner shell ─────────────────────────────────────── */
    #banner {
      position: relative;
      width: 728px;
      height: 90px;
      overflow: hidden;
      background: radial-gradient(9% 76% at 84% 57%, #193566 0%, #0A1528 100%);
      font-family: 'Outfit', sans-serif;
      cursor: pointer;
      user-select: none;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    /* ── All layers: absolute-positioned, start invisible ──── */
    .layer {
      position: absolute;
      opacity: 0;
      will-change: transform;
    }

    /* ── Endcard background overlay ──────────────────────── */
    #endcard-bg {
      position: absolute;
      inset: 0;
      background-color: #1e3c70;
      z-index: 6;
      opacity: 0;
    }

    /* ── Circles ─────────────────────────────────────────── */
    #circles {
      left: 546px;
      top: -16px;
      width: 138px;
      height: 138px;
      z-index: 0;
      transform-origin: 50% 50%;
    }

    /* ── Scene image blocks ──────────────────────────────── */
    #img-01 {
      left: 578px;
      top: 0;
      width: 150px;
      height: 91px;
      overflow: hidden;
      z-index: 2;
    }
    #img-01 img { width: 100%; height: 100%; display: block; object-fit: cover; }

    #img-02 {
      left: 598px;
      top: 0;
      width: 130px;
      height: 90px;
      overflow: hidden;
      z-index: 2;
    }
    #img-02 img { width: 100%; height: 100%; display: block; object-fit: cover; }

    /* ── Scene text blocks ────────────────────────────────── */
    #s1-txt,
    #s2-txt {
      left: 20px;
      top: 0;
      width: 498px;
      height: 68px;
      font-size: 20px;
      font-weight: 700;
      color: #ffffff;
      line-height: 1.1;
      letter-spacing: -0.2px;
      display: flex;
      align-items: center;
      z-index: 3;
    }

    #s3-txt {
      left: 20px;
      top: 0;
      width: 498px;
      height: 68px;
      font-size: 35px;
      font-weight: 700;
      color: #ffffff;
      line-height: 1.1;
      letter-spacing: -0.35px;
      display: flex;
      align-items: center;
      z-index: 3;
    }

    /* ── Popup images ─────────────────────────────────────── */
    #popup-1 {
      left: 548px;
      top: 37px;
      width: 40px;
      height: 40px;
      z-index: 4;
    }
    #popup-1 img { width: 100%; height: 100%; display: block; }

    #popup-2 {
      left: 613px;
      top: 1px;
      width: 30px;
      height: 30px;
      z-index: 4;
    }
    #popup-2 img { width: 100%; height: 100%; display: block; }

    #popup-3 {
      left: 612px;
      top: 1px;
      width: 30px;
      height: 30px;
      z-index: 4;
    }
    #popup-3 img { width: 100%; height: 100%; display: block; }

    #popup-4 {
      left: 442px;
      top: -4px;
      width: 97px;
      height: 97px;
      z-index: 4;
    }
    #popup-4 img { width: 100%; height: 100%; display: block; }

    /* ── Disclaimer bar ───────────────────────────────────── */
    #disclaimer {
      left: 0;
      bottom: 0;
      width: 728px;
      height: 22px;
      background-color: #1e3c70;
      display: flex;
      align-items: center;
      justify-content: start;
      padding: 0 20px;
      z-index: 0;
    }

    #disclaimer span {
      font-size: 11px;
      font-weight: 800;
      color: #e8f1ff;
      letter-spacing: 2.2px;
      text-transform: uppercase;
      line-height: 1;
      white-space: nowrap;
    }

    /* ── Endcard content ──────────────────────────────────── */
    #endcard {
      position: absolute;
      left: 0;
      top: 0;
      width: 728px;
      height: 90px;
      z-index: 7;
    }

    .ec-item {
      opacity: 0;
      will-change: transform;
    }

    #ec-headline {
      position: absolute;
      left: 20px;
      top: 0;
      width: 481px;
      height: 90px;
      font-size: 28px;
      font-weight: 700;
      color: #ffffff;
      line-height: 1.05;
      letter-spacing: -0.28px;
      display: flex;
      align-items: center;
    }

    #ec-logo {
      position: absolute;
      left: 20px;
      top: 50%;
      width: 320px;
      height: 28px;
      flex-shrink: 0;
    }
    #ec-logo img { width: 100%; height: 100%; display: block; }

    #ec-btn {
      position: absolute;
      left: 534px;
      top: 50%;
      width: 174px;
      background-color: #e74c3c;
      padding: 10px 20px;
      border-radius: 4px;
      box-shadow: 0 8px 14px -10px rgba(0, 0, 0, 0.55);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }

    #ec-btn-label {
      display: block;
      font-size: 22px;
      font-weight: 700;
      color: #ffffff;
      line-height: 1.05;
      letter-spacing: -0.22px;
      white-space: nowrap;
    }

    /* ── Banner border overlay ────────────────────────────── */
    #border-ol {
      position: absolute;
      inset: 0;
      border: 1px solid rgba(0, 0, 0, 0.12);
      pointer-events: none;
      z-index: 50;
    }
  </style>
</head>
<body>

  <div id="banner">

    <!-- Endcard background overlay -->
    <div id="endcard-bg"></div>

    <!-- Circles (rotating decorative element) -->
    <img class="layer" id="circles" src="assets/circles.svg" alt="">

    <!-- Scene 1 & 2: main person photo -->
    <div class="layer" id="img-01">
      <img src="assets/img_01.webp" alt="">
    </div>

    <!-- Scene 3: hand photo (slides in from right) -->
    <div class="layer" id="img-02">
      <img src="assets/img_02.webp" alt="">
    </div>

    <!-- Scene texts -->
    <p class="layer" id="s1-txt">Si recibe una llamada, texto o correo electrónico ofreciéndole regalos...</p>
    <p class="layer" id="s2-txt">... o servicios gratuitos a cambio de su número de Medicare</p>
    <p class="layer" id="s3-txt">¡Es una estafa!</p>

    <!-- Popup images -->
    <div class="layer" id="popup-1"><img src="assets/popup-img-1.svg" alt=""></div>
    <div class="layer" id="popup-2"><img src="assets/popup-img-2.svg" alt=""></div>
    <div class="layer" id="popup-3"><img src="assets/popup-img-3.svg" alt=""></div>
    <div class="layer" id="popup-4"><img src="assets/popup-img-4.svg" alt=""></div>

    <!-- Disclaimer bar -->
    <div class="layer" id="disclaimer">
      <span>Un mensaje oficial de Medicare</span>
    </div>

    <!-- Endcard: phase 1 (headline) → phase 2 (logo), button persists -->
    <div id="endcard">
      <p class="ec-item" id="ec-headline">Protéjase contra el fraude a Medicare</p>
      <div class="ec-item" id="ec-logo">
        <img src="assets/medicare-logo.png" alt="Medicare">
      </div>
      <div class="ec-item" id="ec-btn">
        <span id="ec-btn-label">Aprenda más</span>
      </div>
    </div>

    <!-- Border -->
    <div id="border-ol"></div>

  </div><!-- /#banner -->

  <!-- ── GSAP 3 + CustomEase (combined local) ─────────── -->
  <script src="gsap-with-ease.min.js"></script>

  <script>
    /* ── Click tag ──────────────────────────────────────────── */
    var clickTag = "";

    document.getElementById("ec-btn").addEventListener("click", function (e) {
      e.stopPropagation();
      if (clickTag) window.open(clickTag, "_blank");
    });
    document.getElementById("banner").addEventListener("click", function () {
      if (clickTag) window.open(clickTag, "_blank");
    });

    /* ── Register custom eases ──────────────────────────────── */
    CustomEase.create("fadeSlide", "M0,0 C0.22,1 0.36,1 1,1");
    CustomEase.create("snapOut",   "M0,0 C0,0 0.123,1.196 0.33,1.319 0.449,1.389 0.582,1.158 0.68,1.09 0.844,0.974 1,1 1,1");

    /* ── Initial states ─────────────────────────────────────── */
    gsap.set("#s1-txt",      { y: 6 });
    gsap.set("#s2-txt",      { y: 6 });
    gsap.set("#s3-txt",      { y: 6 });
    gsap.set("#popup-1",     { y: 4, scale: 0.9 });
    gsap.set("#popup-2",     { y: 4, scale: 0.9 });
    gsap.set("#popup-3",     { y: 4, scale: 0.9 });
    gsap.set("#popup-4",     { scale: 0.9 });
    gsap.set("#ec-btn",      { yPercent: -50, scale: 0.85 });
    gsap.set("#ec-logo",     { yPercent: -50 });
    gsap.set("#ec-headline", { x: -10 });
    gsap.set("#img-01", { transformOrigin: "bottom right" })

    /* ── Circles: continuous rotation ─────────────────────── */
    gsap.to("#circles", { rotation: 360, duration: 50, ease: "none", repeat: -1 });

    /* ── Timeline  |  15 s × repeat: 1 = 30 s total ────────── */
    var tl = gsap.timeline({ repeat: 1, repeatDelay: 0 });

    /* ── SCENE 1  (0 s – 3.5 s) ──────────────────────────── */
    tl
      .to("#disclaimer",   { opacity: 1,                                        duration: 0.4, ease: "fadeSlide" }, 0)
      .to("#circles",      { opacity: 1,                                        duration: 0.4, ease: "fadeSlide" }, 0)
      .fromTo("#img-01",   { x: 200, opacity: 0 }, { x: 0, opacity: 1,         duration: 0.4, ease: "fadeSlide" }, 0)
      .to("#s1-txt",       { opacity: 1, y: 0,                                  duration: 0.7, ease: "fadeSlide" }, 0.25)
      .to("#popup-1",      { opacity: 1, y: 0, scale: 1,                        duration: 0.4, ease: "snapOut"  }, 0.75)
      .to("#popup-2",      { opacity: 1, y: 0, scale: 1,                        duration: 0.4, ease: "snapOut"  }, 1.5)
      .to(["#popup-1", "#popup-2"], { opacity: 0,                               duration: 0.1, ease: "power2.inOut" }, 3.2)

    /* ── SCENE 1 → 2 ──────────────────────────────────────── */
      .to("#s1-txt",       { opacity: 0,                                        duration: 0.3, ease: "power2.inOut" }, 3.5)

    /* ── SCENE 2  (3.5 s – 7 s) ──────────────────────────── */
      .to("#s2-txt",       { opacity: 1, y: 0,                                  duration: 0.7, ease: "fadeSlide" }, 3.75)
      .to("#popup-3",      { opacity: 1, y: 0, scale: 1,                        duration: 0.4, ease: "snapOut"  }, 4.0)
      .to("#popup-3",      { opacity: 0,                                        duration: 0.1, ease: "power2.inOut" }, 6.3)

    /* ── SCENE 2 → 3 ──────────────────────────────────────── */
      .to("#s2-txt",       { opacity: 0,                                        duration: 0.3, ease: "power2.inOut" }, 6.5)
      .to("#img-01",       { scale: 1.3,                                duration: 0.3, ease: "power2.inOut" }, 6.6)

    /* ── SCENE 3  (7 s – 10.5 s) ─────────────────────────── */
      .fromTo("#img-02",   { x: 140, opacity: 0 }, { x: 0, opacity: 1,         duration: 0.4, ease: "fadeSlide" }, 7.0)
      .to("#s3-txt",       { opacity: 1, y: 0,                                  duration: 0.7, ease: "fadeSlide" }, 7.25)
      .to("#popup-4",      { opacity: 1, scale: 1,                              duration: 0.4, ease: "snapOut"  }, 7.5)
      .to("#popup-4",      { opacity: 0,                                        duration: 0.2, ease: "power2.inOut" }, 9.8)

    /* ── SCENE 3 → ENDCARD ──────────────────────────────── */
      .to(["#s3-txt", "#img-01", "#img-02", "#circles", "#disclaimer"], { opacity: 0, duration: 0.5, ease: "power2.inOut" }, 10.0)
      .to("#endcard-bg",   { opacity: 1,                                        duration: 0.7, ease: "power2.inOut" }, 10.2)

    /* ── ENDCARD phase 1: headline + button  (10.5 s) ─────── */
      .to("#ec-headline",  { opacity: 1, x: 0,                                  duration: 0.7, ease: "fadeSlide" }, 10.5)
      .to("#ec-btn",       { opacity: 1, scale: 1,                              duration: 0.4, ease: "snapOut"  }, 10.75)

    /* ── ENDCARD phase 2: swap headline → logo  (12.3 s) ──── */
      .to("#ec-headline",  { opacity: 0,                                        duration: 0.4, ease: "power2.inOut" }, 12.3)
      .to("#ec-logo",      { opacity: 1,                                        duration: 0.5, ease: "fadeSlide"    }, 12.5)

    /* ── Hold at 15 s, then loop ─────────────────────────── */
      .to({}, { duration: 0.001 }, 15);

    /* ── CTA button hover ───────────────────────────────────── */
    var ecBtn = document.getElementById("ec-btn");
    ecBtn.addEventListener("mouseenter", function () {
      gsap.to(ecBtn, { scale: 1.05, duration: 0.18, ease: "power2.out", overwrite: "auto" });
    });
    ecBtn.addEventListener("mouseleave", function () {
      gsap.to(ecBtn, { scale: 1,    duration: 0.18, ease: "power2.out", overwrite: "auto" });
    });

  </script>
</body>
</html>
